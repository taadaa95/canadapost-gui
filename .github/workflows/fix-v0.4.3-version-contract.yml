name: Fix v0.4.3 version contract

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/release-0.4.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.4.3
          fetch-depth: 0
      - name: Update remaining current-version contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/ui-contract-test.js')
          text = path.read_text(encoding='utf-8')
          old = "assert.strictEqual(pkg.version, '0.4.2');"
          new = "assert.strictEqual(pkg.version, '0.4.3');"
          if old not in text:
              raise SystemExit('expected v0.4.2 UI version contract not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit version-contract fix
        shell: bash
        run: |
          git config user.name "ChatGPT 5.6 Sol"
          git config user.email "noreply@openai.com"
          git add tests/ui-contract-test.js
          git commit -m "test: align UI contract with 0.4.3"
          git push origin HEAD:agent/release-0.4.3
