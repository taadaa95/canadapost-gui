name: Prepare v0.4.4 release

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'agent/release-0.4.4'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.4.4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare release metadata
        run: python scripts/prepare-release-0.4.4.py
      - run: npm ci
      - run: npx install-electron --no
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: xvfb-run -a npm run test:electron
      - run: npm run test:dev10
      - run: npm run test:updates
      - run: npm run test:localization
      - name: Remove temporary release-preparation script before audit
        run: rm scripts/prepare-release-0.4.4.py
      - run: npm run release:audit
      - name: Commit validated clean v0.4.4 source
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          rm .github/workflows/prepare-v0.4.4.yml
          git add -A
          git commit -m "Prepare Canada Post Claim Runner 0.4.4"
          git push origin HEAD:agent/release-0.4.4
