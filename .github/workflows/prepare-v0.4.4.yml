name: Prepare v0.4.4 release

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'agent/release-0.4.4'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.4.4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare release metadata
        run: python scripts/prepare-release-0.4.4.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:dev10
      - run: npm run test:updates
      - run: npm run test:localization
      - run: npm run release:audit
      - name: Commit validated v0.4.4 preparation
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add package.json package-lock.json README.md RELEASE_NOTES.md OPERATING_GUIDE.md MANUAL_RELEASE_GATES.md docs/GITHUB_UPDATES.md docs/LIFECYCLE_AND_PLATFORMS.md docs/MACOS_DISTRIBUTION.md docs/RELEASE_V0.4.4.md tests/github-release-updater-test.js tests/release-metadata-contract-test.js tests/ui-contract-test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prepare Canada Post Claim Runner 0.4.4"
          git push origin HEAD:agent/release-0.4.4
