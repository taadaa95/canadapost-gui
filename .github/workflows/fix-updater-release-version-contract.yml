name: Fix updater release version contract

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/release-0.4.5-updater-version-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.4.5-updater-version-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove updater test release pin
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'tests/github-release-updater-test.js';
          let text = fs.readFileSync(path, 'utf8');
          const old = "assert.strictEqual(require('../package.json').version, '0.4.4');";
          const next = "assert.match(require('../package.json').version, /^\\d+\\.\\d+\\.\\d+$/, 'Updater test requires a release semver');";
          if (!text.includes(old)) throw new Error('Expected stale updater version assertion was not found.');
          fs.writeFileSync(path, text.replace(old, next));
          NODE
          echo 'Remaining 0.4.4 references:'
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git '0\.4\.4' . || true
      - run: npm ci
      - run: npx install-electron --no
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - name: Commit clean updater contract fix
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm .github/workflows/fix-updater-release-version-contract.yml
          git add tests/github-release-updater-test.js
          git commit -m "test: make updater version contract release-safe"
          git push origin HEAD:agent/release-0.4.5-updater-version-fix
