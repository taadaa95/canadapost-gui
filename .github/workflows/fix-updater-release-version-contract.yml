name: Fix updater release version contract

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/release-0.4.5-updater-version-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.4.5-updater-version-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Make v0.4.5 release metadata current
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const updaterTest = 'tests/github-release-updater-test.js';
          let updater = fs.readFileSync(updaterTest, 'utf8');
          const oldUpdater = "assert.strictEqual(require('../package.json').version, '0.4.4');";
          const newUpdater = "assert.match(require('../package.json').version, /^\\d+\\.\\d+\\.\\d+$/, 'Updater test requires a release semver');";
          if (!updater.includes(oldUpdater)) throw new Error('Expected stale updater version assertion was not found.');
          fs.writeFileSync(updaterTest, updater.replace(oldUpdater, newUpdater));

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace(
            'Current public stable version: **0.4.3** for Linux x64 and Windows x64. Version **0.4.4** is the next release candidate and remains unpublished until the exact canonical packages are validated.',
            'Current public stable version: **0.4.4** for Linux x64 and Windows x64. Version **0.4.5** is the current release candidate.'
          );
          if (!readme.includes('Version **0.4.5** is the current release candidate.')) throw new Error('README version update failed.');
          fs.writeFileSync(readmePath, readme);

          const guidePath = 'OPERATING_GUIDE.md';
          let guide = fs.readFileSync(guidePath, 'utf8');
          guide = guide.replace(
            'This is the operator guide for application version **0.4.4** on branch `feature/dev11-beta-release-hardening`. Public stable 0.4.0 supports Linux x64 and Windows x64. Version 0.4.4 remains unpublished until Kris validates the exact canonical packages.',
            'This is the operator guide for application version **0.4.5** on branch `feature/dev11-beta-release-hardening`. Public stable 0.4.4 supports Linux x64 and Windows x64. Version 0.4.5 is the current release candidate.'
          );
          guide = guide.replaceAll('`0.4.4`', '`0.4.5`');
          guide = guide.replaceAll('Runner-0.4.4-', 'Runner-0.4.5-');
          if (!guide.includes('Application | `0.4.5`')) throw new Error('Operating guide version update failed.');
          fs.writeFileSync(guidePath, guide);
          NODE
      - run: npm ci
      - run: npx install-electron --no
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - name: Commit clean release consistency fixes
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm .github/workflows/fix-updater-release-version-contract.yml
          git add tests/github-release-updater-test.js README.md OPERATING_GUIDE.md
          git commit -m "chore(release): align v0.4.5 metadata"
          git push origin HEAD:agent/release-0.4.5-updater-version-fix
