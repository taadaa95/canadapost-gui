name: KISS History Linux test build

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'agent/history-vnext-linux-test'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact green Codex source
        uses: actions/checkout@v4
        with:
          ref: 83c35dd0f22501ca942cdc8d0c15969e3fec5003
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npm run package:linux
      - run: npm run package:audit -- dist/packages/linux-unpacked
      - run: npm run package:size -- dist/packages
      - name: Verify AppImage
        shell: bash
        run: test -f dist/packages/Canada.Post.Claim.Runner-0.4.4-linux-x86_64.AppImage
      - name: Upload Linux test AppImage
        uses: actions/upload-artifact@v4
        with:
          name: kiss-history-linux-test
          path: dist/packages/Canada.Post.Claim.Runner-0.4.4-linux-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
