name: Fix release version contract

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/release-0.4.5-ci-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.4.5-ci-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove release-specific hardcoded UI version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'tests/ui-contract-test.js';
          let text = fs.readFileSync(path, 'utf8');
          const old = "assert.strictEqual(pkg.version, '0.4.4');";
          const next = [
            "const packageLock = require('../package-lock.json');",
            "assert.match(pkg.version, /^\\d+\\.\\d+\\.\\d+$/, 'Package version must be a release semver');",
            "assert.strictEqual(packageLock.version, pkg.version);",
            "assert.strictEqual(packageLock.packages[''].version, pkg.version);"
          ].join('\n');
          if (!text.includes(old)) throw new Error('Expected stale version assertion was not found.');
          text = text.replace(old, next);
          fs.writeFileSync(path, text);
          NODE
      - run: npm ci
      - run: node tests/ui-contract-test.js
      - run: npm run lint
      - run: npm run typecheck
      - name: Commit clean CI contract fix
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm .github/workflows/fix-release-version-contract.yml
          git add tests/ui-contract-test.js
          git commit -m "test: make UI version contract release-safe"
          git push origin HEAD:agent/release-0.4.5-ci-fix
