name: Cleanup v0.4.5 artifact transfer

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/v0.4.5-artifact-transfer'
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary transfer prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.4.5-transfer-1ed752f \
            -R taadaa95/canadapost-gui \
            --yes --cleanup-tag
