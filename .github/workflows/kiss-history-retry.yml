name: KISS History Retry

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/kiss-history-retry-status'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiss-history-retry-status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply KISS History changes
        run: python scripts/apply-kiss-history-retry.py
      - name: Remove temporary transform
        run: rm scripts/apply-kiss-history-retry.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Focused History contract
        run: node tests/history-kiss-contract-test.js
      - name: Show History assertion context
        run: nl -ba tests/history-refinement-test.js | sed -n '165,180p'
      - name: History browser regression
        run: node tests/history-refinement-test.js
      - run: npm test
      - run: npm run test:localization
      - run: npm run lint
      - run: npm run typecheck
      - name: Commit validated product changes
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git reset .github/workflows/kiss-history-retry.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "KISS: make History current, sortable, and retryable"
          git push origin HEAD:agent/kiss-history-retry-status
