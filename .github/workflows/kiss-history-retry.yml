name: KISS History Retry

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/kiss-history-retry-status'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiss-history-retry-status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply KISS History changes
        run: python scripts/apply-kiss-history-retry.py
      - name: Correct transformed History assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/history-refinement-test.js')
          s = p.read_text(encoding='utf-8')
          old = "    assert.strictEqual(await page.locator('#historyList').getByText('Submitted', { exact: true }).count() >= 1, true);"
          new = "    assert.strictEqual(await page.locator('#historyList .history-row.history-status-submitted').filter({ hasText: 'RETRY-SUCCESS' }).count(), 1);"
          if old not in s:
              raise SystemExit('expected retry success assertion not found')
          s = s.replace(old, new, 1)
          hidden_filter = "      await window.refreshHistory();\n    });\n    await page.locator('#historyStatusFilter').selectOption('all');\n    assert.strictEqual(await page.locator('#historyList').getByText('NEW-HISTORY-RECORD', { exact: true }).count(), 1, 'History did not display a newly refreshed record');"
          hidden_filter_fixed = "      await window.refreshHistory();\n    });\n    assert.strictEqual(await page.locator('#historyList').getByText('NEW-HISTORY-RECORD', { exact: true }).count(), 1, 'History did not display a newly refreshed record');"
          if hidden_filter not in s:
              raise SystemExit('expected hidden History filter assertion not found')
          p.write_text(s.replace(hidden_filter, hidden_filter_fixed, 1), encoding='utf-8')

          p = Path('tests/localization-test.js')
          s = p.read_text(encoding='utf-8')
          old = "  assert.ok(!Object.keys(locale).some(key => key.startsWith('history.filter.')), 'History filter localization must be removed');"
          new = "  for (const key of ['history.filter.label', 'history.filter.all', 'history.filter.submitted', 'history.filter.needsAttention', 'history.filter.failed', 'history.filter.alreadySubmitted', 'history.filter.rejected']) {\n    assert.ok(Object.hasOwn(locale, key) && String(locale[key] || '').trim(), `${key} must be localized`);\n  }"
          if old not in s:
              raise SystemExit('expected stale History localization assertion not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('tests/ui-contract-test.js')
          s = p.read_text(encoding='utf-8')
          old = "  'historySearch', 'historyStatusFilter', 'clearHistoryFilters', 'reconciliationList',"
          new = "  'historySearch', 'clearHistoryFilters', 'reconciliationList',"
          if old not in s:
              raise SystemExit('expected stale History UI removed-ID assertion not found')
          s = s.replace(old, new, 1)
          anchor = "for (const removedId of [\n  'historySearch', 'clearHistoryFilters', 'reconciliationList',\n  'reconciliationCountPill', 'addManualShipment', 'manualShipmentList',\n  'historyClassificationList', 'refreshBrowserSession', 'clearBrowserSession', 'browserSessionStatus'\n]) assert.ok(!historyMarkup.includes(`id=\"${removedId}\"`), `History must not retain #${removedId}`);"
          replacement = anchor + "\nassert.strictEqual((historyMarkup.match(/id=\"historyStatusFilter\"/g) || []).length, 1, 'History must contain exactly one simple status filter');"
          if anchor not in s:
              raise SystemExit('expected History UI contract anchor not found')
          p.write_text(s.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Remove temporary transform
        run: rm scripts/apply-kiss-history-retry.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Focused History contract
        run: node tests/history-kiss-contract-test.js
      - name: History browser regression
        run: node tests/history-refinement-test.js
      - run: npm test
      - run: npm run test:localization
      - run: npm run lint
      - run: npm run typecheck
      - name: Commit validated product changes
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git reset .github/workflows/kiss-history-retry.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "KISS: make History current, sortable, and retryable"
          git push origin HEAD:agent/kiss-history-retry-status
