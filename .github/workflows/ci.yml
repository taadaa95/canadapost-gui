name: Validate and package

on:
  push:
    branches:
      [
        main,
        v0.4.0-productization,
        feature/github-release-updater,
        feature/dev9-ui-debloat,
        feature/dev10-step3-executable-queue,
      ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Electron runtime
        timeout-minutes: 10
        run: npx install-electron --no
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm test
      - run: npm run test:dev10
      - name: Mock portal tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run -a npm run test:mock-portal
      - name: Mock portal tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: npm run test:mock-portal
      - name: Step 3 mock visibility E2E (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: xvfb-run -a npm run test:step3-mock-visibility
      - name: Step 3 mock visibility E2E (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: npm run test:step3-mock-visibility
      - run: npm run test:accessibility
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron
      - if: runner.os == 'Windows'
        run: npm run test:electron
      - run: npm run lint
      - run: npm run lint:dev10
      - if: runner.os == 'Linux'
        run: npm run format:check
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run secret-scan
      - run: npm run release:audit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run sbom
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: release-metadata
          path: dist/release-metadata
          if-no-files-found: error
          retention-days: 7

  gitleaks:
    name: External secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  package-linux:
    name: Linux package and content audit
    needs: [test, gitleaks]
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
      RELEASE_CHANNEL: beta
      RELEASE_PLATFORM: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Electron runtime
        timeout-minutes: 10
        run: npx install-electron --no
      - run: npx playwright install --with-deps chromium
      - run: npm run package:linux
      - run: npm run package:audit -- dist/packages/linux-unpacked
      - run: npm run package:size -- dist/packages
      - run: npm run test:packaged-step1
      - run: npm run sbom
      - run: npm run release:finalize
      - run: npm run release:validate
      - uses: actions/upload-artifact@v4
        with:
          name: linux-beta-unsigned
          path: |
            dist/packages/*
            dist/release-metadata/package-manifest-linux.json
            dist/release-metadata/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Windows package
    needs: [test, gitleaks]
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
      RELEASE_CHANNEL: beta
      RELEASE_PLATFORM: windows
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Electron runtime
        timeout-minutes: 10
        run: npx install-electron --no
      - run: npx playwright install chromium
      - run: npm run package:windows
      - run: npm run package:audit -- dist/packages/win-unpacked
      - run: npm run package:size -- dist/packages
      - run: npm run sbom
      - run: npm run release:finalize
      - run: npm run release:validate
      - uses: actions/upload-artifact@v4
        with:
          name: windows-beta-unsigned
          path: |
            dist/packages/*
            dist/release-metadata/package-manifest-windows.json
            dist/release-metadata/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 7
