name: Prepare v0.4.6

on:
  push:
    branches:
      - release/prepare-v0.4.6

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/prepare-v0.4.6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bump version to 0.4.6
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.4.6 --no-git-tag-version
          python3 - <<'PY'
          from pathlib import Path
          p = Path('package.json')
          s = p.read_text()
          old = 'dist/packages/Canada.Post.Claim.Runner-0.4.5-linux-x86_64.AppImage'
          new = 'dist/packages/Canada.Post.Claim.Runner-0.4.6-linux-x86_64.AppImage'
          if old not in s:
              raise SystemExit('Expected v0.4.5 packaged AppImage test path was not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Validate release source
        run: |
          npm ci
          npm test
          npm run lint
          npm run typecheck

      - name: Commit prepared source and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-v0.4.6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/prepare-v0.4.6.yml
          git commit -m "Prepare v0.4.6"
          git push origin HEAD:release/prepare-v0.4.6
