name: Validate Step 1 KISS fix on Windows

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  validate-build-windows:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/kiss-two-step-workflow'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiss-two-step-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Step 1 transformation
        run: python scripts/apply-step1-kiss-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Install Electron runtime
        run: npx install-electron --no
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Validate Step 1 layout and contracts
        run: |
          node tests/step1-kiss-layout-test.js
          npm run test:accessibility
          npm run test:localization
          node tests/ui-contract-test.js
          node tests/workflow-simplification-contract-test.js
          node tests/product-ui-cleanup-test.js
          npm run lint
          npm run typecheck
      - name: Build Windows test installer
        run: npm run package:windows
      - name: Audit packaged application
        run: npm run package:audit -- dist/packages/win-unpacked
      - name: Upload visual screenshot
        uses: actions/upload-artifact@v4
        with:
          name: step1-kiss-windows-screenshot
          path: dist/test-artifacts/step1-kiss-layout.png
          if-no-files-found: error
          retention-days: 2
      - name: Upload Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: Canada-Post-Claim-Runner-0.4.3-Step1-fix-Windows-test
          path: dist/packages/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Commit validated application changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html renderer.js renderer/base.css locales/en-CA.json locales/fr-CA.json tests/step1-kiss-layout-test.js; then
            echo "No application changes to commit."
            exit 0
          fi
          git diff --check
          git config user.name "ChatGPT 5.6 Sol"
          git config user.email "noreply@openai.com"
          git add index.html renderer.js renderer/base.css locales/en-CA.json locales/fr-CA.json tests/step1-kiss-layout-test.js
          git commit -m "Fix Step 1 two-phase layout and progress display"
          git push origin HEAD:agent/kiss-two-step-workflow
