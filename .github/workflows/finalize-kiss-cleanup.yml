name: Finalize KISS cleanup

on:
  push:
    branches:
      - agent/kiss-two-step-workflow

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiss-two-step-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply final cleanup
        run: python scripts/finalize-kiss-cleanup.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/step1-kiss-layout-test.js
      - run: node tests/live-log-layout-test.js
      - run: node tests/architecture-decomposition-test.js
      - run: npm test
      - name: Commit green cleanup
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add renderer/base.css tests/localization-test.js tests/product-ui-cleanup-test.js tests/ui-contract-test.js tests/live-log-layout-test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clean two-step workflow contracts and Step 1 CSS"
          git push origin HEAD:agent/kiss-two-step-workflow
