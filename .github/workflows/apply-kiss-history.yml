name: Apply KISS History changes

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.head_ref == 'agent/kiss-history-retry-sort'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiss-history-retry-sort
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply History transformation
        shell: pwsh
        run: python scripts/apply-kiss-history.py
      - run: npm ci
      - run: npx install-electron --no
      - run: npx playwright install chromium
      - run: node tests/history-status-model-test.js
      - run: node tests/history-refinement-test.js
      - run: npm run test:dev10
      - run: npm run test:localization
      - run: npm run lint
      - run: npm run typecheck
      - name: Commit validated product changes
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html renderer.js renderer/base.css lib/claim-database.js locales/en-CA.json locales/fr-CA.json tests/history-refinement-test.js tests/history-status-model-test.js package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "KISS: make History current, sortable and retryable"
          git push origin HEAD:agent/kiss-history-retry-sort
