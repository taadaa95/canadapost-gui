name: Apply KISS two-step workflow changes v4

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/kiss-two-step-workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiss-two-step-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply product transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-kiss-two-step-v3.yml').read_text(encoding='utf-8')
          start_marker = "        run: |\n"
          end_marker = "\n      - name: Install dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          Path('/tmp/apply-kiss-v3.sh').write_text(textwrap.dedent(workflow[start:end]), encoding='utf-8')
          PY
          bash /tmp/apply-kiss-v3.sh
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/localization-test.js')
          text = path.read_text(encoding='utf-8')
          old = "'Run Step 1 — Import Shipment History', 'Force Stop', 'Step 2 — Check Tracking / Create Claims',"
          new = "'Run Step 1 — Import Shipment History', 'Force Stop', 'Identify Late Candidates',"
          if text.count(old) != 1:
              raise SystemExit(f'localization reviewed-copy matcher expected 1, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate non-visual behavior
        run: |
          npm test
          npm run test:dev10
          npm run test:updates
          npm run test:localization
          npm run lint
          npm run lint:dev10
          npm run typecheck
      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "ChatGPT 5.6 Sol"
          git config user.email "noreply@openai.com"
          git add index.html renderer.js lib/github-release-updater.js locales/en-CA.json locales/fr-CA.json tests/github-release-updater-test.js tests/ui-contract-test.js tests/workflow-simplification-contract-test.js tests/localization-test.js
          git commit -m "Simplify settings and combine workflow into two steps"
          git push origin HEAD:agent/kiss-two-step-workflow
