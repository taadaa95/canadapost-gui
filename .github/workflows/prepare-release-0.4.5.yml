name: Prepare v0.4.5 release source

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'agent/release-0.4.5'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.4.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bump source version to 0.4.5
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '0.4.5';
          if (pkg.scripts?.['test:packaged-isolated-appimage']) {
            pkg.scripts['test:packaged-isolated-appimage'] = pkg.scripts['test:packaged-isolated-appimage'].replace('0.4.4', '0.4.5');
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = '0.4.5';
          if (lock.packages?.['']) lock.packages[''].version = '0.4.5';
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - run: npm ci
      - run: npx install-electron --no
      - run: npx playwright install --with-deps chromium
      - run: node tests/history-source-of-truth-test.js
      - run: node tests/history-kiss-contract-test.js
      - run: node tests/history-refinement-test.js
      - run: npm run test:release-metadata
      - run: npm run lint
      - run: npm run typecheck
      - name: Commit clean v0.4.5 source
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm .github/workflows/prepare-release-0.4.5.yml
          git add package.json package-lock.json
          git commit -m "chore(release): prepare v0.4.5"
          git push origin HEAD:agent/release-0.4.5
