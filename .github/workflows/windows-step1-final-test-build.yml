name: Final Windows Step 1 test build

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/kiss-two-step-workflow'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiss-two-step-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Electron runtime
        run: npx install-electron --no
      - name: Build Windows test installer
        run: npm run package:windows
      - name: Audit packaged application
        run: npm run package:audit -- dist/packages/win-unpacked
      - name: Upload Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: Canada-Post-Claim-Runner-0.4.3-Step1-final-Windows-test
          path: dist/packages/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
