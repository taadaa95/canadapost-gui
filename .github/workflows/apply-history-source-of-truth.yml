name: Apply History source of truth fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.head_ref == 'agent/kiss-history-retry-status'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiss-history-retry-status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply History fix
        run: python scripts/apply-history-source-of-truth.py
      - run: npm ci
      - run: npx install-electron --no
      - run: npx playwright install --with-deps chromium
      - run: node tests/history-source-of-truth-test.js
      - run: node tests/history-kiss-contract-test.js
      - run: node tests/history-refinement-test.js
      - run: npm test
      - run: npm run test:localization
      - run: npm run lint
      - run: npm run typecheck
      - name: Commit validated product changes
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add lib/claim-database.js renderer.js tests/database-test.js tests/history-refinement-test.js tests/history-kiss-contract-test.js tests/history-source-of-truth-test.js package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(history): use one authoritative current record set"
          git push origin HEAD:agent/kiss-history-retry-status
