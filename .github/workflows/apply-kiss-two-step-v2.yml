name: Apply KISS two-step workflow changes v2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/kiss-two-step-workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiss-two-step-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply product changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          def rd(p): return Path(p).read_text(encoding='utf-8')
          def wr(p, s): Path(p).write_text(s, encoding='utf-8')
          def rep1(s, old, new, name):
              n = s.count(old)
              if n != 1: raise SystemExit(f'{name}: expected 1, got {n}')
              return s.replace(old, new, 1)
          def sub1(s, pattern, repl, name, flags=0):
              s2, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1: raise SystemExit(f'{name}: expected 1, got {n}')
              return s2

          # Idempotent second pass after the workflow's own commit.
          if "const SAVED_SECRET_MASK = '••••••••';" in rd('renderer.js') and 'id="tabStep2"' not in rd('index.html'):
              print('KISS product changes already applied; validation only.')
              raise SystemExit(0)

          # index.html
          s = rd('index.html')
          s = sub1(s, r'^\s*<button id="tabStep2"[^\n]*\n', '', 'remove tracking tab', re.M)
          s = rep1(s, '<input id="trackingClientId" type="text" data-i18n-placeholder="settings.api.clientIdPlaceholder" autocomplete="off" />', '<input id="trackingClientId" type="password" data-i18n-placeholder="settings.api.clientIdPlaceholder" autocomplete="off" />', 'mask API key input')
          s = sub1(s, r'^\s*<div class="settings-note" data-i18n="settings\.website\.securityNote"></div>\n', '', 'remove security note', re.M)
          s = sub1(s, r'\n\s*<details class="settings-note">\s*\n\s*<summary data-i18n="settings\.api\.advanced"></summary>[\s\S]*?</details>', '', 'remove advanced API settings')
          for key in ('settings.api.metadataPending', 'settings.api.accessNote'):
              s = sub1(s, rf'^\s*<div[^\n]*data-i18n="{re.escape(key)}"[^\n]*</div>\n', '', f'remove {key}', re.M)
          s = sub1(s, r'^\s*<button id="runTrackingOnly"[^\n]*\n', '', 'remove manual tracking button', re.M)
          wr('index.html', s)

          # renderer.js
          s = rd('renderer.js')
          s = rep1(s, "const DEFAULT_THEME = 'system';\n", "const DEFAULT_THEME = 'system';\nconst SAVED_SECRET_MASK = '••••••••';\n", 'secret mask constant')
          s = rep1(s, "let currentProcessStep = 'step1';\n", "let currentProcessStep = 'step1';\nlet autoTrackingAfterImport = false;\n", 'auto tracking flag')
          merge = """function mergeTrackingIntoStep1() {
            const importStep = $('step1');
            const trackingStep = $('step2');
            if (!importStep || !trackingStep) return;
            trackingStep.classList.remove('tab-panel');
            trackingStep.classList.add('step1-tracking-phase');
            trackingStep.removeAttribute('role');
            trackingStep.removeAttribute('aria-labelledby');
            trackingStep.hidden = false;
            importStep.appendChild(trackingStep);
          }

          """
          s = rep1(s, 'function stepForStage(stage) {\n', merge + 'function stepForStage(stage) {\n', 'merge tracking phase')
          old_get = """function getFieldValue(id) {
            const el = $(id);
            return el ? String(el.value || '').trim() : '';
          }

          """
          helpers = old_get + """function getSecretFieldValue(id) {
            const value = $(id)?.value || '';
            return value === SAVED_SECRET_MASK ? '' : value;
          }

          function applyStoredCredentialMasks() {
            const password = $('webPassword');
            if (password) {
              password.value = state.passwordStored ? SAVED_SECRET_MASK : '';
              password.placeholder = tr('settings.website.passwordPlaceholder');
            }
            const clientId = $('trackingClientId');
            if (clientId) {
              clientId.value = state.trackingApiCredentialsStored ? SAVED_SECRET_MASK : '';
              clientId.placeholder = tr('settings.api.clientIdPlaceholder');
            }
            const clientSecret = $('trackingClientSecret');
            if (clientSecret) {
              clientSecret.value = state.trackingApiCredentialsStored ? SAVED_SECRET_MASK : '';
              clientSecret.placeholder = tr('settings.api.clientSecretPlaceholder');
            }
          }

          function initSavedSecretInputs() {
            for (const id of ['webPassword', 'trackingClientId', 'trackingClientSecret']) {
              const input = $(id);
              input?.addEventListener('focus', () => {
                if (input.value === SAVED_SECRET_MASK) input.select();
              });
            }
          }

          """
          s = rep1(s, old_get, helpers, 'secret helpers')
          s = rep1(s, "webPassword: $('webPassword')?.value || '',", "webPassword: getSecretFieldValue('webPassword'),", 'web password collection')
          s = rep1(s, "trackingClientId: getFieldValue('trackingClientId'),", "trackingClientId: getSecretFieldValue('trackingClientId'),", 'API key collection')
          s = rep1(s, "trackingClientSecret: $('trackingClientSecret')?.value || '',", "trackingClientSecret: getSecretFieldValue('trackingClientSecret'),", 'API secret collection')
          needle = "  if (stepId === 'step1' && !settings.estCustomerNumber) missing.push(tr('settings.est.customerNumber', 'Customer Number'));\n"
          s = rep1(s, needle, needle + "  if (stepId === 'step1' && !state.trackingApiCredentialsStored) missing.push(tr('settings.api.credentialsRequired', 'Tracking API credentials'));\n", 'Step 1 API validation')
          s = sub1(s, r"    if \(\$\('webPassword'\)\) \$\('webPassword'\)\.value = '';\n    if \(\$\('trackingClientId'\)\) \$\('trackingClientId'\)\.value = '';\n    if \(\$\('trackingClientSecret'\)\) \$\('trackingClientSecret'\)\.value = '';", "    applyStoredCredentialMasks();", 'mask after save')
          s = sub1(s, r"  if \(\$\('webPassword'\)\) \{\n    \$\('webPassword'\)\.value = '';\n    \$\('webPassword'\)\.placeholder = tr\(state\.passwordStored \? 'settings\.website\.passwordSavedPlaceholder' : 'settings\.website\.passwordPlaceholder'\);\n  \}\n  if \(\$\('trackingClientId'\)\) \{[^\n]+\}\n  if \(\$\('trackingClientSecret'\)\) \{[^\n]+\}\n  renderTrackingApiCredentialMetadata\(cfg\.trackingApiCredentialMetadata \|\| \{\}\);", "  applyStoredCredentialMasks();\n  renderTrackingApiCredentialMetadata(cfg.trackingApiCredentialMetadata || {});", 'mask on config load')
          s = rep1(s, "async function startTrackingOnly() {\n  currentProcessStep = 'step2';\n", "async function startTrackingOnly() {\n  currentProcessStep = 'step2';\n  state.claimQueueLoaded = false;\n", 'invalidate candidate queue')
          s = rep1(s, "$('importEstHistory')?.addEventListener('click', async () => {\n  currentProcessStep = 'step1';\n  resetRunUi('step1');\n", "$('importEstHistory')?.addEventListener('click', async () => {\n  currentProcessStep = 'step1';\n  autoTrackingAfterImport = false;\n  resetRunUi('step1');\n  resetRunUi('step2');\n", 'reset Step 1 phases')
          s = rep1(s, "window.cpApp.onEvent(({ stage, event }) => {\n  const message = describeEvent(stage, event);\n", "window.cpApp.onEvent(({ stage, event }) => {\n  if (stage === 'est-history' && event?.type === 'est_complete') {\n    autoTrackingAfterImport = event.outcome !== 'EMPTY' && Number(event.imported || 0) > 0;\n  }\n  const message = describeEvent(stage, event);\n", 'mark import complete')
          tail = """  updateCounters();
            if (['complete', 'complete_with_warnings', 'failed', 'blocked', 'stopped', 'diagnostic_complete'].includes(payload.status)) {
              refreshHistory().catch(() => {});
            }
          });
          """
          # YAML indentation can alter literal indentation, so use a regex for this block.
          s = sub1(s, r"  updateCounters\(\);\n  if \(\['complete', 'complete_with_warnings', 'failed', 'blocked', 'stopped', 'diagnostic_complete'\]\.includes\(payload\.status\)\) \{\n    refreshHistory\(\)\.catch\(\(\) => \{\}\);\n  \}\n\}\);", """  updateCounters();
          if (step === 'step1' && ['failed', 'blocked', 'stopped'].includes(payload.status)) autoTrackingAfterImport = false;
          if (step === 'step1' && autoTrackingAfterImport && ['complete', 'complete_with_warnings'].includes(payload.status)) {
            autoTrackingAfterImport = false;
            window.setTimeout(() => startTrackingOnly(), 0);
          }
          if (['complete', 'complete_with_warnings', 'failed', 'blocked', 'stopped', 'diagnostic_complete'].includes(payload.status)) {
            refreshHistory().catch(() => {});
          }
          });""", 'auto-chain tracking')
          s = rep1(s, "initThemePicker();\ninitStepTabs();\ninitLiveLogs();\n", "initThemePicker();\nmergeTrackingIntoStep1();\ninitSavedSecretInputs();\ninitStepTabs();\ninitLiveLogs();\n", 'KISS init')
          wr('renderer.js', s)

          # Windows updater: remove hidden PowerShell trampoline.
          s = rd('lib/github-release-updater.js')
          s = sub1(s, r"  if \(platform === 'win32'\) \{\n    beforeExit\(\);\n    const escaped = downloadedPath\.replace\(/'\/g, \"''\"\);\n    const script = `Wait-Process[^\n]+\n    launchDetached\('powershell\.exe'[^\n]+\n    app\.quit\(\);\n    return;\n  \}", """  if (platform === 'win32') {
            beforeExit();
            const openError = await shell.openPath(downloadedPath);
            if (openError) {
              shell.showItemInFolder?.(downloadedPath);
              throw fail('UPDATE_WINDOWS_INSTALLER_OPEN_FAILED', `The verified Windows installer could not be opened: ${openError}`);
            }
            app.quit();
            return { installerOpened: true };
          }""", 'visible Windows installer')
          wr('lib/github-release-updater.js', s)

          # Localized copy: two customer-facing steps everywhere.
          for loc in ('locales/en-CA.json', 'locales/fr-CA.json'):
              d = json.loads(rd(loc)); fr = loc.endswith('fr-CA.json')
              old2, old3, new1, new2 = ('Étape 2','Étape 3','Étape 1','Étape 2') if fr else ('Step 2','Step 3','Step 1','Step 2')
              token = '__SUBMISSION_STEP__'
              for k,v in list(d.items()):
                  if isinstance(v,str): d[k] = v.replace(old3, token).replace(old2, new1).replace(token, new2)
              if fr:
                  d.update({
                    'app.subtitle':'Importez l’historique, repérez automatiquement les envois en retard, puis soumettez-les en deux étapes simples.',
                    'nav.step1.title':'Étape 1','nav.step1.detail':'Importer et repérer les retards',
                    'nav.step2.title':'Repérage','nav.step2.detail':'Repérer les envois en retard',
                    'nav.step3.title':'Étape 2','nav.step3.detail':'Soumettre les envois en retard',
                    'step1.title':'Étape 1 — Importer et repérer les envois en retard',
                    'step2.title':'Repérer les envois en retard','step3.title':'Étape 2 — Soumettre les envois en retard',
                    'settings.website.remember':'Se souvenir de moi','settings.api.credentialsRequired':'Identifiants de l’API de suivi'})
              else:
                  d.update({
                    'app.subtitle':'Import shipping history, automatically identify late candidates, then submit them in two simple steps.',
                    'nav.step1.title':'Step 1','nav.step1.detail':'Import & identify late candidates',
                    'nav.step2.title':'Identify','nav.step2.detail':'Identify late candidates',
                    'nav.step3.title':'Step 2','nav.step3.detail':'Submit late candidates',
                    'step1.title':'Step 1 — Import & Identify Late Candidates',
                    'step2.title':'Identify Late Candidates','step3.title':'Step 2 — Submit Late Candidates',
                    'settings.website.remember':'Remember me','settings.api.credentialsRequired':'Tracking API credentials'})
              d['settings.website.securityNote'] = ''
              d['settings.website.passwordSavedPlaceholder'] = d.get('settings.website.passwordPlaceholder','')
              d['settings.api.clientIdSavedPlaceholder'] = d.get('settings.api.clientIdPlaceholder','')
              d['settings.api.clientSecretSavedPlaceholder'] = d.get('settings.api.clientSecretPlaceholder','')
              for k in ('settings.api.advanced','settings.api.defaultsNote','settings.api.metadataPending','settings.api.metadata','settings.api.accessNote'):
                  if k in d: d[k] = ''
              wr(loc, json.dumps(d, ensure_ascii=False, indent=2) + '\n')

          # Updater test: assert visible installer launch and failure behavior.
          s = rd('tests/github-release-updater-test.js')
          s = sub1(s, r"    await updater\.installUpdate\(\{\n      app: \{ quit: \(\) => \{ quitCalled = true; \} \},\n      shell: \{\},\n      downloadedPath: downloadedAppImage,\n      update: candidate,\n      currentVersion: '0\.4\.0',\n      platform: 'win32',\n      launchDetached: \(command, args\) => launches\.push\(\{ command, args \}\)\n    \}\);\n    assert\.strictEqual\(launches\.length, 1\);\n    assert\.strictEqual\(launches\[0\]\.command, 'powershell\.exe'\);\n    assert\.strictEqual\(quitCalled, true\);", """    const windowsOpened = [];
            let windowsBeforeExit = 0;
            await updater.installUpdate({
              app: { quit: () => { quitCalled = true; } },
              shell: { openPath: async file => { windowsOpened.push(file); return ''; } },
              downloadedPath: downloadedAppImage,
              update: candidate,
              currentVersion: '0.4.0',
              platform: 'win32',
              beforeExit: () => { windowsBeforeExit += 1; },
              launchDetached: (command, args) => launches.push({ command, args })
            });
            assert.deepStrictEqual(windowsOpened, [downloadedAppImage]);
            assert.strictEqual(windowsBeforeExit, 1);
            assert.strictEqual(launches.length, 0);
            assert.strictEqual(quitCalled, true);
            quitCalled = false;
            await assert.rejects(() => updater.installUpdate({
              app: { quit: () => { quitCalled = true; } },
              shell: { openPath: async () => 'synthetic installer launch failure', showItemInFolder: () => {} },
              downloadedPath: downloadedAppImage,
              update: candidate,
              currentVersion: '0.4.0',
              platform: 'win32'
            }), error => error.code === 'UPDATE_WINDOWS_INSTALLER_OPEN_FAILED');
            assert.strictEqual(quitCalled, false);""", 'Windows updater regression test')
          wr('tests/github-release-updater-test.js', s)

          # Update existing product/UI contracts.
          s = rd('tests/ui-contract-test.js')
          s = s.replace("'trackingClientId', 'trackingClientSecret', 'trackingRequestDelayMs', 'trackingResourceTimeoutMs', 'trackingApiCredentialMetadata', 'clearTrackingApiCredentials',\n  'runTrackingOnly', 'forceStopStep2',", "'trackingClientId', 'trackingClientSecret', 'clearTrackingApiCredentials',\n  'forceStopStep2',")
          s = s.replace("assert.match(html, /id=\"runTrackingOnly\"[^>]*data-i18n=\"step2\\.run\"/);", "assert.doesNotMatch(html, /id=\"runTrackingOnly\"/);")
          s = sub1(s, r"assert\.ok\(englishLocale\['settings\.website\.remember'\]\.includes\('save password securely on this device'\)\);\nassert\.ok\(englishLocale\['settings\.website\.securityNote'\]\.includes\('AES-256-GCM device-local encryption'\)\);\nassert\.ok\(englishLocale\['settings\.website\.passwordSavedPlaceholder'\]\.includes\('Saved password available — leave blank to reuse'\)\);", """assert.strictEqual(englishLocale['settings.website.remember'], 'Remember me');
          assert.strictEqual(englishLocale['settings.website.securityNote'], '');
          assert.strictEqual(englishLocale['settings.website.passwordSavedPlaceholder'], englishLocale['settings.website.passwordPlaceholder']);
          assert.match(html, /id="trackingClientId"[^>]*type="password"/);
          assert.match(renderer, /const SAVED_SECRET_MASK = '••••••••'/);""", 'credential UI contract')
          s = s.replace("const stepTabs = [...html.matchAll(/<button id=\"tab(?:Settings|Step1|Step2|Step3|History|Results)\"[^>]*>([\\s\\S]*?)<\\/button>/g)];\nassert.strictEqual(stepTabs.length, 6, 'All six workflow tabs must use the shared tab structure');", "const stepTabs = [...html.matchAll(/<button id=\"tab(?:Settings|Step1|Step3|History|Results)\"[^>]*>([\\s\\S]*?)<\\/button>/g)];\nassert.strictEqual(stepTabs.length, 5, 'Settings, two workflow steps, History, and Results must remain');\nassert.ok(!html.includes('id=\"tabStep2\"'));\nassert.strictEqual(englishLocale['nav.step3.title'], 'Step 2');\nassert.match(renderer, /function mergeTrackingIntoStep1/);")
          s = s.replace("for (const id of ['importEstHistory', 'forceStopStep1', 'runTrackingOnly', 'forceStopStep2', 'runSubmitOnly', 'stop', 'forceStopStep3']) {", "for (const id of ['importEstHistory', 'forceStopStep1', 'forceStopStep2', 'runSubmitOnly', 'stop', 'forceStopStep3']) {")
          s = rep1(s, "assert.match(settingsMarkup, /id=\"checkForUpdates\"/);", "assert.match(settingsMarkup, /id=\"checkForUpdates\"/);\nassert.doesNotMatch(settingsMarkup, /settings\\.website\\.securityNote/);\nassert.doesNotMatch(settingsMarkup, /settings\\.api\\.(?:advanced|metadataPending|accessNote)/);\nassert.doesNotMatch(settingsMarkup, /id=\"trackingRequestDelayMs\"|id=\"trackingResourceTimeoutMs\"|id=\"trackingApiCredentialMetadata\"/);", 'Settings contract additions')
          wr('tests/ui-contract-test.js', s)

          s = rd('tests/workflow-simplification-contract-test.js')
          s = s.replace("assert.strictEqual(english['step1.title'], 'Step 1 — Import Shipment History');", "assert.strictEqual(english['step1.title'], 'Step 1 — Import & Identify Late Candidates');")
          s = s.replace("assert.strictEqual(english['nav.step1.detail'], 'Import Shipment History');", "assert.strictEqual(english['nav.step1.detail'], 'Import & identify late candidates');")
          s = s.replace("assert.strictEqual(french['step1.title'], 'Étape 1 — Importer l’historique des envois');", "assert.strictEqual(french['step1.title'], 'Étape 1 — Importer et repérer les envois en retard');")
          s = s.replace("assert.strictEqual(french['nav.step1.detail'], 'Importer l’historique des envois');", "assert.strictEqual(french['nav.step1.detail'], 'Importer et repérer les retards');")
          marker = "assert.doesNotMatch(JSON.stringify({ english, french }), /Import EST history|Importer l.historique EST/i);\n"
          s = rep1(s, marker, marker + "assert.strictEqual(english['nav.step3.title'], 'Step 2');\nassert.strictEqual(english['step3.title'], 'Step 2 — Submit Late Candidates');\nassert.doesNotMatch(html, /id=\"tabStep2\"/);\nassert.doesNotMatch(html, /id=\"runTrackingOnly\"/);\nassert.match(renderer, /function mergeTrackingIntoStep1/);\nassert.match(renderer, /autoTrackingAfterImport/);\n", 'two-step contract additions')
          wr('tests/workflow-simplification-contract-test.js', s)

          # Static guardrails.
          html, renderer, updater = rd('index.html'), rd('renderer.js'), rd('lib/github-release-updater.js')
          assert 'id="tabStep2"' not in html and 'id="runTrackingOnly"' not in html
          assert 'settings.website.securityNote' not in html and 'settings.api.advanced' not in html
          assert "shell.openPath(downloadedPath)" in updater and 'Start-Process -FilePath' not in updater
          assert 'window.setTimeout(() => startTrackingOnly(), 0)' in renderer
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate non-visual behavior
        run: |
          npm test
          npm run test:dev10
          npm run test:updates
          npm run test:localization
          npm run lint
          npm run lint:dev10
          npm run typecheck
      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git config user.name "ChatGPT 5.6 Sol"
          git config user.email "noreply@openai.com"
          git add index.html renderer.js lib/github-release-updater.js locales/en-CA.json locales/fr-CA.json tests/github-release-updater-test.js tests/ui-contract-test.js tests/workflow-simplification-contract-test.js
          git commit -m "Simplify settings and combine workflow into two steps"
          git push origin HEAD:agent/kiss-two-step-workflow
