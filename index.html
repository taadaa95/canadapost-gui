<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="app.title"></title>
  <link rel="stylesheet" href="renderer/base.css" />
  <link rel="stylesheet" href="renderer/components.css" />
</head>
<body>
  <header>
    <div id="isolatedTestBanner" class="isolated-test-banner" role="status" aria-live="polite" hidden>
      <span data-i18n="app.isolatedBanner"></span>
      <span id="isolatedTestPath" class="isolated-test-path"></span>
    </div>
    <div class="topbar">
      <div>
        <h1 id="appTitle" data-i18n="app.title"></h1><span id="buildTrustStatus" class="pill warn" data-i18n="build.unsigned"></span>
        <div id="appSubtitle" class="subtitle" data-i18n="app.subtitle"></div>
      </div>
      <div class="theme-control">
        <label for="localeSelect" data-i18n="settings.language"></label>
        <select id="localeSelect"><option value="en-CA">English (Canada)</option><option value="fr-CA">Français (Canada)</option></select>
        <label for="themeSelect" data-i18n="settings.theme"></label>
        <select id="themeSelect">
          <option value="system" data-i18n="theme.system"></option>
          <option value="dark" data-i18n="theme.dark"></option>
          <option value="light" data-i18n="theme.light"></option>
          <option value="high-contrast" data-i18n="theme.highContrast"></option>
        </select>
      </div>
    </div>
  </header>

  <main class="tabbed-main">
    <section class="card app-shell">
      <div class="setup-head">
        <div class="file-grid compact-actions">
          <button id="selectCsv" class="secondary" data-i18n="action.importCsv"></button>
          <button id="openData" class="secondary" data-i18n="action.dataFolder"></button>
          <button id="openLogs" class="secondary" data-i18n="action.logs"></button>
          <button id="fullRefresh" class="warning" data-i18n="action.resetUi"></button>
        </div>
      </div>

      <div class="step-tabs" role="tablist" data-i18n-aria-label="nav.sectionsAria">
        <button id="tabSettings" class="step-tab active" data-tab="settingsTab" type="button" role="tab" aria-controls="settingsTab" aria-selected="true" tabindex="0"><span class="step-tab-title" data-i18n="nav.settings.title"></span><span class="step-tab-detail" data-i18n="nav.settings.detail"></span></button>
        <button id="tabStep1" class="step-tab" data-tab="step1" type="button" role="tab" aria-controls="step1" aria-selected="false" tabindex="-1"><span class="step-tab-title" data-i18n="nav.step1.title"></span><span class="step-tab-detail" data-i18n="nav.step1.detail"></span></button>
        <button id="tabStep2" class="step-tab" data-tab="step2" type="button" role="tab" aria-controls="step2" aria-selected="false" tabindex="-1"><span class="step-tab-title" data-i18n="nav.step2.title"></span><span class="step-tab-detail" data-i18n="nav.step2.detail"></span></button>
        <button id="tabStep3" class="step-tab" data-tab="step3" type="button" role="tab" aria-controls="step3" aria-selected="false" tabindex="-1"><span class="step-tab-title" data-i18n="nav.step3.title"></span><span class="step-tab-detail" data-i18n="nav.step3.detail"></span></button>
        <button id="tabHistory" class="step-tab" data-tab="historyTab" type="button" role="tab" aria-controls="historyTab" aria-selected="false" tabindex="-1"><span class="step-tab-title" data-i18n="nav.history.title"></span><span class="step-tab-detail" data-i18n="nav.history.detail"></span></button>
        <button id="tabResults" class="step-tab" data-tab="resultsTab" type="button" role="tab" aria-controls="resultsTab" aria-selected="false" tabindex="-1"><span class="step-tab-title" data-i18n="nav.results.title"></span><span class="step-tab-detail" data-i18n="nav.results.detail"></span><span id="notificationsBadge" class="notification-badge hidden" data-i18n-aria-label="results.notificationsAria"></span></button>
      </div>

      <section id="settingsTab" class="tab-panel settings-panel active" role="tabpanel" aria-labelledby="tabSettings">
        <div class="step-title-row">
          <h2 data-i18n="settings.title"></h2>
          <div><button id="resumeSetup" class="secondary hidden" type="button" data-i18n="action.resumeSetup"></button> <span id="settingsStatus" class="pill" data-i18n="settings.notSaved"></span></div>
        </div>

        <div class="settings-grid">
          <div class="settings-section">
            <h3 data-i18n="settings.website.title"></h3>
            <div class="field">
              <label for="webUsername" data-i18n="settings.website.username"></label>
              <input id="webUsername" type="text" data-i18n-placeholder="settings.website.usernamePlaceholder" autocomplete="username" />
            </div>
            <div class="field">
              <label for="webPassword" data-i18n="settings.website.password"></label>
              <input id="webPassword" type="password" data-i18n-placeholder="settings.website.passwordPlaceholder" autocomplete="current-password" />
            </div>
            <div class="check-row">
              <label><input id="rememberSettings" type="checkbox" checked /> <span data-i18n="settings.website.remember"></span></label>
            </div>
            <div class="settings-note" data-i18n="settings.website.securityNote"></div>
          </div>

          <div class="settings-section">
            <h3 data-i18n="settings.api.title"></h3>
            <div class="field">
              <label for="trackingClientId" data-i18n="settings.api.clientId"></label>
              <input id="trackingClientId" type="text" data-i18n-placeholder="settings.api.clientIdPlaceholder" autocomplete="off" />
            </div>
            <div class="field">
              <label for="trackingClientSecret" data-i18n="settings.api.clientSecret"></label>
              <input id="trackingClientSecret" type="password" data-i18n-placeholder="settings.api.clientSecretPlaceholder" autocomplete="new-password" />
            </div>
            <div class="field">
              <label for="trackingApiEnvironment" data-i18n="settings.api.environment"></label>
              <select id="trackingApiEnvironment"><option value="test" data-i18n="environment.test"></option><option value="production" data-i18n="environment.production"></option></select>
            </div>
            <details class="settings-note">
              <summary data-i18n="settings.api.advanced"></summary>
              <div class="field">
                <label for="trackingRequestDelayMs" data-i18n="settings.api.requestInterval"></label>
                <input id="trackingRequestDelayMs" type="number" min="3100" max="60000" step="100" value="3100" inputmode="numeric" />
              </div>
              <div class="field">
                <label for="trackingResourceTimeoutMs" data-i18n="settings.api.timeout"></label>
                <input id="trackingResourceTimeoutMs" type="number" min="1000" max="120000" step="1000" value="45000" inputmode="numeric" />
              </div>
              <div data-i18n="settings.api.defaultsNote"></div>
            </details>
            <div id="trackingApiCredentialMetadata" class="settings-note" data-i18n="settings.api.metadataPending"></div>
            <div id="trackingDiagnosticGate" class="settings-note" data-i18n="settings.api.diagnosticGate"></div>
            <div class="settings-note" data-i18n="settings.api.accessNote"></div>
            <button id="clearTrackingApiCredentials" class="warning" type="button" data-i18n="settings.api.clear"></button>
          </div>

          <div class="settings-section">
            <h3 data-i18n="settings.est.title"></h3>
            <div class="field">
              <label for="estCustomerNumber" data-i18n="settings.est.customerNumber"></label>
              <input id="estCustomerNumber" type="text" data-i18n-placeholder="placeholder.customerNumber" data-i18n-aria-label="settings.est.customerNumber" autocomplete="off" />
            </div>
          </div>

          <div class="settings-section wide">
            <h3 data-i18n="settings.sender.title"></h3>
            <div class="settings-two-col">
              <div class="field">
                <label for="claimStreetNumber" data-i18n="settings.sender.streetNumber"></label>
                <input id="claimStreetNumber" type="text" data-i18n-placeholder="placeholder.streetNumber" />
              </div>
              <div class="field">
                <label for="claimStreetName" data-i18n="settings.sender.streetName"></label>
                <input id="claimStreetName" type="text" data-i18n-placeholder="placeholder.streetName" />
              </div>
            </div>
            <div class="settings-three-col">
              <div class="field">
                <label for="claimPostalCode" data-i18n="settings.sender.postalCode"></label>
                <input id="claimPostalCode" type="text" data-i18n-placeholder="placeholder.postalCode" />
              </div>
              <div class="field">
                <label for="claimCity" data-i18n="settings.sender.city"></label>
                <input id="claimCity" type="text" data-i18n-placeholder="placeholder.city" />
              </div>
              <div class="field">
                <label for="claimProvince" data-i18n="settings.sender.province"></label>
                <input id="claimProvince" type="text" data-i18n-placeholder="placeholder.province" />
              </div>
            </div>
            <div class="field">
              <label for="claimAddressLine2" data-i18n="settings.sender.addressLine2"></label>
              <input id="claimAddressLine2" type="text" data-i18n-placeholder="placeholder.addressLine2" />
            </div>
          </div>

          <div class="settings-section wide">
            <h3 data-i18n="settings.contact.title"></h3>
            <div class="settings-three-col">
              <div class="field">
                <label for="claimBusinessName" data-i18n="settings.contact.businessName"></label>
                <input id="claimBusinessName" type="text" data-i18n-placeholder="placeholder.businessName" />
              </div>
              <div class="field">
                <label for="claimContactName" data-i18n="settings.contact.name"></label>
                <input id="claimContactName" type="text" data-i18n-placeholder="placeholder.contactName" />
              </div>
              <div class="field">
                <label for="claimContactPhone" data-i18n="settings.contact.phone"></label>
                <input id="claimContactPhone" type="text" data-i18n-placeholder="placeholder.phone" />
              </div>
            </div>
            <div class="field">
              <label for="claimContactEmail" data-i18n="settings.contact.email"></label>
              <input id="claimContactEmail" type="email" data-i18n-placeholder="placeholder.email" />
            </div>
          </div>
<div class="settings-section wide">
            <button id="saveUserSettings" class="success" type="button" data-i18n="settings.save"></button>
            <details class="settings-note advanced-settings">
              <summary id="advancedSettingsTitle" data-i18n="settings.advanced"></summary>
              <button id="manageStoredData" class="secondary" type="button" data-i18n="privacy.manageStoredData"></button>
            </details>
            <div class="settings-footer-actions">
              <button id="checkForUpdates" class="secondary" type="button" data-i18n="update.check"></button>
              <div class="app-version"><span data-i18n="app.version"></span> <strong id="appVersion"></strong></div>
            </div>
          </div>
        </div>
      </section>

      <section id="step1" class="tab-panel step-panel" role="tabpanel" aria-labelledby="tabStep1">
        <div class="step-top">
          <div class="step-title-row">
            <h2 data-i18n="step1.title"></h2>
            <span class="pill" data-i18n="step1.createsTrackingCsv"></span>
          </div>
          <div class="step-fields step1-fields">
            <div class="field">
              <label for="estFrom" data-i18n="step1.fromDate"></label>
              <input id="estFrom" type="date" />
            </div>
            <div class="field">
              <label for="estTo" data-i18n="step1.toDate"></label>
              <input id="estTo" type="date" />
            </div>
          </div>
          <input id="estWorkgroup" type="hidden" value="" />
          <input id="estMobo" type="hidden" value="-2" />
          <input id="estCategoryGroup" type="hidden" value="SHP" />
          <input id="estFileTypes" type="hidden" value="1,2" />
          <input id="historyFrom" type="hidden" />
          <input id="historyTo" type="hidden" />
          <input id="historyCustomerNumber" type="hidden" />
          <input id="historyMobo" type="hidden" />
          <input id="historyAutoMobo" type="checkbox" checked hidden />
          <input id="historyIncludeNoManifest" type="checkbox" checked hidden />
          <div class="step-actions">
            <button id="importEstHistory" class="success" data-i18n="step1.run"></button>
            <button id="forceStopStep1" class="danger" data-force-stop="step1" data-i18n="action.forceStop"></button>
          </div>
        </div>
        <div class="step-workspace">
          <div class="card step-status-card">
            <div class="row" style="justify-content: space-between;">
              <h2 style="margin:0;" data-i18n="step1.statusTitle"></h2>
              <span id="step1RunStatus" class="pill" data-i18n="runStatus.idle"></span>
            </div>
            <div class="status-grid">
              <div class="stat"><div id="step1Orders" class="num">0</div><div class="label" data-i18n="step1.ordersFound"></div></div>
              <div class="stat"><div id="step1Imported" class="num">0</div><div class="label" data-i18n="step1.shipmentsImported"></div></div>
              <div class="stat"><div id="step1Workgroups" class="num">0</div><div class="label" data-i18n="step1.workgroups"></div></div>
              <div id="step1WarningsCard" class="stat stat-clickable" role="button" tabindex="0" data-i18n-aria-label="step1.warningsAria"><div id="step1Warnings" class="num">0</div><div class="label" data-i18n="step1.warningsInspect"></div></div>
            </div>
            <div class="progress-wrap">
              <div class="progress-label"><span data-i18n="step1.progress"></span><span id="step1Pct">0%</span></div>
              <progress id="step1Progress" max="100" value="0"></progress>
            </div>
            <div class="current-action" id="step1CurrentAction" data-i18n="status.waiting"></div>
          </div>
          <div class="card step-log-card">
            <div class="live-log-header"><h2 data-i18n="step1.liveLog"></h2><button id="step1JumpLatest" class="secondary jump-latest" type="button" hidden data-i18n="log.jumpLatest"></button></div>
            <div id="step1Log" class="log" role="log" aria-live="polite" aria-relevant="additions"></div>
          </div>
        </div>
      </section>

      <section id="step2" class="tab-panel step-panel" role="tabpanel" aria-labelledby="tabStep2">
        <div class="step-top">
          <div class="step-title-row">
            <h2 data-i18n="step2.title"></h2>
            <span class="pill" data-i18n="step2.readsTrackingCsv"></span>
          </div>
          <div class="step-fields step2-fields">
            <div class="check-row step-checks">
              <label><input id="freshTracking" type="checkbox" checked /> <span data-i18n="step2.freshRun"></span></label>
            </div>
            <div id="step2CandidateExplanation" class="step-copy-box" data-i18n="step2.candidateExplanation"></div>
          </div>
          <div class="step-actions">
            <button id="runTrackingOnly" class="success" data-i18n="step2.run"></button>
            <button id="testTrackingConnection" class="secondary" type="button" data-i18n="step2.testConnection"></button>
            <button id="exportTrackingStructure" class="secondary" type="button" data-i18n="step2.exportStructure"></button>
            <button id="discardIncompleteTracking" class="warning" type="button" data-i18n="step2.discardIncomplete"></button>
            <button id="forceStopStep2" class="danger" data-force-stop="step2" data-i18n="action.forceStop"></button>
          </div>
        </div>
        <div class="step-workspace">
          <div class="card step-status-card">
            <div class="row" style="justify-content: space-between;">
              <h2 style="margin:0;" data-i18n="step2.statusTitle"></h2>
              <span id="step2RunStatus" class="pill" data-i18n="runStatus.idle"></span>
            </div>
            <div class="status-grid">
              <div class="stat"><div id="checked" class="num">0</div><div class="label" data-i18n="step2.checked"></div></div>
              <div class="stat"><div id="late" class="num">0</div><div class="label" data-i18n="step2.lateClaims"></div></div>
              <div class="stat"><div id="onTime" class="num">0</div><div class="label" data-i18n="step2.onTime"></div></div>
              <div class="stat"><div id="notDelivered" class="num">0</div><div class="label" data-i18n="step2.notDelivered"></div></div>
            </div>
            <div class="progress-wrap">
              <div class="progress-label"><span data-i18n="step2.progress"></span><span id="trackingPct">0%</span></div>
              <progress id="trackingProgress" max="100" value="0"></progress>
            </div>
            <div class="current-action" id="step2CurrentAction" data-i18n="status.waiting"></div>
          </div>
          <div class="card step-log-card">
            <div class="live-log-header"><h2 data-i18n="step2.liveLog"></h2><button id="step2JumpLatest" class="secondary jump-latest" type="button" hidden data-i18n="log.jumpLatest"></button></div>
            <div id="step2Log" class="log" role="log" aria-live="polite" aria-relevant="additions"></div>
          </div>
        </div>
      </section>

      <section id="step3" class="tab-panel step-panel" role="tabpanel" aria-labelledby="tabStep3">
        <div class="step-top">
          <div class="step-title-row">
            <h2 data-i18n="step3.title"></h2>
            <span class="pill" data-i18n="step3.readsCandidates"></span>
          </div>
          <div class="step-fields step3-fields compact-step3-fields">
            <div class="field checkbox-field builtin-browser-field">
              <label class="checkbox-label"><input id="builtinBrowser" type="checkbox" checked disabled /> <span data-i18n="step3.useBuiltinBrowser"></span> <span class="muted-inline" data-i18n="step3.browserLayout"></span></label>
            </div>
            <div class="field checkbox-field">
              <label class="checkbox-label"><input id="dryRun" type="checkbox" checked /> <span data-i18n="step3.dryRun"></span></label>
            </div>
          </div>
          <div id="step3CanadaPostSupport" role="note" data-i18n="step3.supportGuidance" data-i18n-aria-label="step3.supportAriaLabel"></div>
          <div class="step3-browser-session-row">
            <button id="checkStep3BrowserSession" class="secondary compact-button" type="button" data-i18n="browserSession.check"></button>
            <p id="step3BrowserSessionStatus" class="browser-session-status" role="status" aria-live="polite" data-i18n="browserSession.notChecked"></p>
          </div>
          <section id="step3ActionAdvisory" class="step3-action-advisory hidden" aria-labelledby="step3ActionAdvisoryTitle" aria-live="assertive">
            <h3 id="step3ActionAdvisoryTitle" data-i18n="step3.actionIssues.title"></h3>
            <div id="step3ActionIssues" class="blocking-check-list"></div>
            <div id="step3ActionWarningCount" class="modal-summary"></div>
          </section>
          <input id="freshRun" type="checkbox" hidden />
          <div class="step-actions step-actions-3">
            <button id="runSubmitOnly" class="success" data-i18n="step3.submitSelected"></button>
            <button id="stop" class="warning" data-i18n="step3.stopAfterCurrent"></button>
            <button id="forceStopStep3" class="danger" data-force-stop="step3" data-i18n="action.forceStop"></button>
          </div>
        </div>
        <div class="step3-body">
        <div class="step3-side-pane">
        <div class="step3-control-grid">
          <section class="step3-control-card" aria-labelledby="claimQueueTitle">
            <div class="step3-control-head">
              <div>
                <h3 id="claimQueueTitle" data-i18n="step3.candidateQueue"></h3>
                <span id="claimQueueCount" class="pill" data-i18n="step3.queue.initialCount"></span>
              </div>
              <div class="step3-control-actions">
                <button id="refreshClaimQueue" class="secondary" type="button" data-i18n="action.refresh"></button>
                <button id="selectAllClaims" class="secondary" type="button" data-i18n="step3.selectAll"></button>
                <button id="clearClaimSelection" class="secondary" type="button" data-i18n="step3.clearSelection"></button>
              </div>
            </div>
            <div class="history-toolbar queue-toolbar" data-i18n-aria-label="step3.queue.filtersAria">
              <div class="field"><label for="claimQueueSearch" data-i18n="step3.queue.search"></label><input id="claimQueueSearch" type="search" data-i18n-placeholder="step3.queue.searchPlaceholder" /></div>
              <div class="field"><label for="claimQueueServiceFilter" data-i18n="step3.queue.service"></label><select id="claimQueueServiceFilter"><option value="all" data-i18n="step3.queue.allServices"></option></select></div>
              <div class="field"><label for="claimQueueUrgencyFilter" data-i18n="step3.queue.deadlineGuidance"></label><select id="claimQueueUrgencyFilter"><option value="all" data-i18n="step3.queue.allGuidance"></option><option value="advisory" data-i18n="step3.queue.advisory"></option><option value="unavailable" data-i18n="step3.queue.unavailable"></option></select></div>
              <div class="field"><label for="claimQueueDateFrom" data-i18n="step3.queue.deadlineFrom"></label><input id="claimQueueDateFrom" type="date" /></div>
              <div class="field"><label for="claimQueueDateTo" data-i18n="step3.queue.deadlineTo"></label><input id="claimQueueDateTo" type="date" /></div>
            </div>
            <div id="claimQueueList" class="claim-queue-list" aria-live="polite">
              <div class="history-empty" data-i18n="step3.queue.refreshEmpty"></div>
            </div>
          </section>
        </div>
          <div class="card step3-progress-card">
            <div class="progress-wrap">
              <div class="progress-label"><span data-i18n="step3.progress"></span><span><span id="submitProcessedMini">0/0</span> · <span id="submitPct">0%</span></span></div>
              <progress id="submitProgress" max="100" value="0"></progress>
            </div>
          </div>
        </div>
        <div class="step-workspace step3-workspace builtin-browser-enabled">
          <div class="card step-browser-card">
            <div class="row step-browser-header" style="justify-content: space-between;">
              <h2 style="margin:0;" data-i18n="step3.browserTitle"></h2>
              <span id="builtinBrowserStatus" class="pill" data-i18n="step3.browser.idleStatus"></span>
            </div>
            <div id="builtinBrowserActivity" class="browser-activity" aria-live="polite" aria-atomic="true">
              <div class="browser-activity-copy">
                <span class="browser-activity-dot" aria-hidden="true"></span>
                <span id="builtinBrowserActivityText" data-i18n="step3.browser.idleStatus"></span>
              </div>
              <div class="browser-activity-track" aria-hidden="true"><span></span></div>
            </div>
            <div id="builtinBrowserSlot" class="browser-slot">
              <div class="browser-slot-placeholder" data-i18n="step3.browser.idle"></div>
            </div>
          </div>
        </div>
        <div class="card step-log-card step3-log-card">
          <div class="row step3-log-header" style="justify-content: space-between; align-items: center;">
            <h2 style="margin:0;" data-i18n="step3.liveLog"></h2>
            <div class="live-log-actions"><button id="step3JumpLatest" class="secondary jump-latest" type="button" hidden data-i18n="log.jumpLatest"></button><button id="openStep3Diagnostics" class="secondary compact-button" type="button" data-i18n="diagnostics.openDetailed"></button></div>
          </div>
          <div id="step3Log" class="log" role="log" aria-live="polite" aria-relevant="additions"></div>
        </div>
        </div>
      </section>

      <section id="historyTab" class="tab-panel history-panel" role="tabpanel" aria-labelledby="tabHistory">
        <div class="step-title-row">
          <h2 data-i18n="history.title"></h2>
          <span id="databaseIntegrity" class="pill" data-i18n="database.checking"></span>
        </div>

        <div class="history-summary">
          <div class="stat"><div id="historyShipments" class="num">0</div><div class="label" data-i18n="history.shipmentsRecorded"></div></div>
          <div class="stat"><div id="historySubmitted" class="num">0</div><div class="label" data-i18n="history.submitted"></div></div>
          <div class="stat"><div id="historyReconciliation" class="num">0</div><div class="label" data-i18n="history.needReconciliation"></div></div>
          <div class="stat"><div id="historyFailed" class="num">0</div><div class="label" data-i18n="history.retryableFailures"></div></div>
        </div>

        <div>
          <div class="history-toolbar">
            <div class="field">
              <label for="historySearch" data-i18n="history.searchLabel"></label>
              <input id="historySearch" type="search" data-i18n-placeholder="history.searchPlaceholder" />
            </div>
            <div class="field">
              <label for="historyStatusFilter" data-i18n="common.status"></label>
              <select id="historyStatusFilter">
                <option value="all" data-i18n="history.filter.all"></option>
                <option value="submitted" data-i18n="history.filter.submitted"></option>
                <option value="submitted_manual" data-i18n="history.filter.submittedManual"></option>
                <option value="already_submitted" data-i18n="history.filter.alreadySubmitted"></option>
                <option value="failed" data-i18n="history.filter.failed"></option>
                <option value="unknown" data-i18n="history.filter.unknown"></option>
                <option value="not_submitted" data-i18n="history.filter.notSubmitted"></option>
                <option value="retry_approved" data-i18n="history.filter.retryApproved"></option>
                <option value="dry_run_ready" data-i18n="history.filter.dryRunReady"></option>
                <option value="dry_run_interrupted" data-i18n="history.filter.dryRunInterrupted"></option>
              </select>
            </div>
            <button id="clearHistoryFilters" class="secondary" type="button" data-i18n="history.clearFilters" data-i18n-aria-label="history.clearFiltersLabel" disabled></button>
            <button id="refreshHistory" class="secondary" type="button" data-i18n="action.refresh"></button>
            <button id="exportHistory" class="secondary" type="button" data-i18n="history.exportCsv"></button>
            <button id="createBackup" class="secondary" type="button" data-i18n="action.createBackup"></button>
            <button id="restoreBackup" class="warning" type="button" data-i18n="action.restoreBackup"></button>
            <button id="createDiagnostics" class="secondary" type="button" data-i18n="support.bundle"></button>
          </div>
          <div class="history-toolbar" style="margin-top:4px;grid-template-columns:auto auto minmax(0,1fr);">
            <button id="refreshBrowserSession" class="secondary" type="button" data-i18n="browserSession.check"></button>
            <button id="clearBrowserSession" class="warning" type="button" data-i18n="action.clearSession"></button>
            <div id="browserSessionStatus" class="browser-session-status" role="status" aria-live="polite" data-i18n="browserSession.notChecked"></div>
          </div>
          <details class="history-details">
            <summary data-i18n="history.manual.title"></summary>
            <div class="manual-entry-grid">
              <div class="field"><label for="manualTracking" data-i18n="history.manual.tracking"></label><input id="manualTracking" type="text" /></div>
              <div class="field"><label for="manualReference" data-i18n="history.manual.reference"></label><input id="manualReference" type="text" /></div>
              <div class="field"><label for="manualService" data-i18n="history.manual.service"></label><input id="manualService" type="text" /></div>
              <div class="field"><label for="manualPostal" data-i18n="history.manual.postal"></label><input id="manualPostal" type="text" /></div>
              <div class="field"><label for="manualExpected" data-i18n="history.manual.expected"></label><input id="manualExpected" type="date" /></div>
              <div class="field"><label for="manualDelivery" data-i18n="history.manual.delivery"></label><input id="manualDelivery" type="date" /></div>
              <div class="field wide"><label for="manualNote" data-i18n="history.manual.note"></label><input id="manualNote" type="text" /></div>
              <button id="addManualShipment" class="secondary" type="button" data-i18n="history.manual.save"></button>
            </div>
            <div id="manualShipmentList" class="history-list compact" aria-live="polite"></div>
          </details>
          <details class="history-details">
            <summary id="historyClassificationsTitle" data-i18n="history.classifications"></summary>
            <div id="historyClassificationList" class="history-list compact" aria-live="polite"></div>
          </details>
        </div>

        <div class="history-content">
          <div class="history-section">
            <div class="history-section-head"><h3 data-i18n="history.reconciliationQueue"></h3><span id="reconciliationCountPill" class="pill" data-i18n="history.zeroUnresolved"></span></div>
            <div id="reconciliationList" class="history-list history-record-list"></div>
          </div>
          <div class="history-section">
            <div class="history-section-head"><h3 data-i18n="history.claimAttempts"></h3><span id="historyResultCount" class="pill" role="status" aria-live="polite" data-i18n="history.zeroRecords"></span></div>
            <div id="historyList" class="history-list history-record-list"></div>
          </div>
        </div>
      </section>

      <section id="resultsTab" class="tab-panel results-panel" role="tabpanel" aria-labelledby="tabResults">
        <div class="step-title-row">
          <h2 data-i18n="results.title"></h2>
          <span id="notificationsCountPill" class="pill" data-i18n="results.zeroNotifications"></span>
        </div>

        <div id="opsListScreen" class="operations-grid">
          <div class="operations-panel">
            <div class="mini-title" data-i18n="results.clickDetails"></div>
            <div class="ops-table" id="resultsList"></div>
          </div>
        </div>

        <div id="detailScreen" class="detail-screen hidden">
          <div class="detail-toolbar">
            <button id="backToOperations" class="secondary" data-i18n="results.back"></button>
            <span id="detailBadge" class="pill" data-i18n="results.detailBadge"></span>
          </div>

          <div class="detail-grid">
            <div class="detail-card">
              <h3 id="detailTitle" class="detail-title" data-i18n="results.detailTitle"></h3>

              <div class="detail-meta-grid">
                <div class="detail-meta"><div class="detail-label" data-i18n="common.status"></div><div id="detailStatus" class="detail-value">—</div></div>
                <div class="detail-meta"><div class="detail-label" data-i18n="common.time"></div><div id="detailTime" class="detail-value">—</div></div>
                <div class="detail-meta"><div class="detail-label" data-i18n="common.csvRow"></div><div id="detailRow" class="detail-value">—</div></div>
                <div class="detail-meta"><div class="detail-label" data-i18n="common.source"></div><div id="detailSource" class="detail-value">—</div></div>
                <div class="detail-meta wide"><div class="detail-label" data-i18n="common.trackingNumber"></div><div id="detailTracking" class="detail-value">—</div></div>
              </div>

              <div class="detail-section-title" data-i18n="results.explanation"></div>
              <div id="detailExplanation" class="detail-copy">—</div>

              <div class="detail-section-title" data-i18n="results.automationDecision"></div>
              <div id="detailDecision" class="detail-copy">—</div>
            </div>

            <div class="detail-card evidence-card">
              <div class="mini-title" data-i18n="results.canadaPostEvidence"></div>
              <div id="detailEvidenceStatus" class="detail-copy" data-i18n="results.loadingEvidence"></div>
              <div class="detail-evidence-actions">
                <button id="openScreenshot" class="secondary" data-i18n="results.openScreenshot"></button>
              </div>
              <div id="detailScreenshotWrap" class="detail-screenshot-wrap hidden">
                <img id="detailScreenshot" class="detail-screenshot" data-i18n-alt="results.screenshotAlt" />
              </div>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>


  <div id="liveSubmitModal" class="modal-backdrop hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="liveSubmitModalTitle">
      <div class="modal-head">
        <h2 id="liveSubmitModalTitle" data-i18n="step3.confirm.title"></h2>
      </div>
      <div id="liveSubmitSummary" class="live-submit-summary"></div>
      <div class="live-submit-warning" data-i18n="step3.confirm.warning"></div>
      <label class="live-submit-ack"><input id="liveSubmitCanary" type="checkbox" checked /> <span id="liveSubmitCanaryLabel" data-i18n="step3.confirm.canaryOption"></span></label>
      <label class="live-submit-ack"><input id="liveSubmitAcknowledge" type="checkbox" /> <span data-i18n="step3.confirm.acknowledge"></span></label>
      <div class="live-submit-modal-actions">
        <button id="cancelLiveSubmit" class="secondary" type="button" data-i18n="action.cancel"></button>
        <button id="confirmLiveSubmit" class="success" type="button" disabled data-i18n="step3.confirm.start"></button>
      </div>
    </div>
  </div>

  <div id="trackingDiagnosticModal" class="modal-backdrop hidden" aria-hidden="true">
    <div class="modal-card modal-card-compact" role="dialog" aria-modal="true" aria-labelledby="trackingDiagnosticTitle">
      <div class="modal-head"><h2 id="trackingDiagnosticTitle" data-i18n="step2.diagnostic.title"></h2></div>
      <p id="trackingDiagnosticMessage" data-i18n="step2.diagnostic.message"></p>
      <div class="field"><label id="trackingDiagnosticRowLabel" for="trackingDiagnosticRow" data-i18n="step2.diagnostic.rowLabel"></label><input id="trackingDiagnosticRow" type="number" min="1" step="1" value="1" inputmode="numeric" /></div>
      <div id="trackingDiagnosticError" class="live-submit-warning hidden" role="alert"></div>
      <div class="live-submit-modal-actions"><button id="cancelTrackingDiagnostic" class="secondary" type="button" data-i18n="action.cancel"></button><button id="confirmTrackingDiagnostic" class="success" type="button" data-i18n="action.continue"></button></div>
    </div>
  </div>

  <div id="privacyDataModal" class="modal-backdrop hidden" aria-hidden="true">
    <div class="modal-card privacy-modal-card" role="dialog" aria-modal="true" aria-labelledby="privacyDataTitle">
      <div class="modal-head"><div><h2 id="privacyDataTitle" data-i18n="privacy.title"></h2><span id="privacyDataStatus" class="pill" data-i18n="privacy.status.previewRequired"></span></div><button id="closePrivacyDataModal" class="secondary" type="button" data-i18n="action.close"></button></div>
      <p id="privacyDataIntro" data-i18n="privacy.intro"></p>
      <div class="privacy-management-grid">
        <div class="field wide"><label id="privacyTrackingLabel" for="privacyTrackingNumbers" data-i18n="privacy.trackingLabel"></label><textarea id="privacyTrackingNumbers" rows="3"></textarea></div>
        <div class="field"><label id="privacyDateFromLabel" for="privacyDateFrom" data-i18n="privacy.dateFrom"></label><input id="privacyDateFrom" type="date" /></div>
        <div class="field"><label id="privacyDateToLabel" for="privacyDateTo" data-i18n="privacy.dateTo"></label><input id="privacyDateTo" type="date" /></div>
        <label class="wide"><input id="privacyAllRecords" type="checkbox" /> <span id="privacyAllRecordsLabel" data-i18n="privacy.allRecords"></span></label>
      </div>
      <button id="previewPrivacyData" class="secondary" type="button" data-i18n="privacy.preview"></button>
      <div id="privacyPreviewCounts" class="privacy-preview-counts" aria-live="polite"></div>
      <div id="privacyDeletionControls" class="privacy-management-grid hidden">
        <label class="wide"><input id="privacyDestructiveConfirm" type="checkbox" /> <span id="privacyDestructiveConfirmLabel" data-i18n="privacy.destructiveConfirm"></span></label>
        <div class="field wide"><label id="privacyTypedPhraseLabel" for="privacyTypedPhrase" data-i18n="privacy.typedPhraseLabel"></label><input id="privacyTypedPhrase" type="text" autocomplete="off" /></div>
        <div id="privacyExpectedPhrase" class="live-submit-warning wide"></div>
        <label id="privacySecondConfirmWrap" class="wide hidden"><input id="privacySecondConfirm" type="checkbox" /> <span id="privacySecondConfirmLabel" data-i18n="privacy.secondConfirm"></span></label>
        <button id="deletePrivacyData" class="danger wide" type="button" data-i18n="privacy.delete"></button>
      </div>
      <p id="privacyExternalCopiesNotice" data-i18n="privacy.externalCopies"></p>
    </div>
  </div>

  <div id="warningModal" class="modal-backdrop hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="warningModalTitle">
      <div class="modal-head">
        <h2 id="warningModalTitle" data-i18n="step1.warningsTitle"></h2>
        <button id="closeWarningModal" class="secondary" type="button" data-i18n="action.close"></button>
      </div>
      <div id="warningModalSummary" class="modal-summary" data-i18n="step1.noWarnings"></div>
      <div id="warningList" class="warning-list"></div>
    </div>
  </div>

  <div id="backupPasswordModal" class="modal-backdrop hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="backupPasswordTitle">
      <div class="modal-head"><h2 id="backupPasswordTitle" data-i18n="backup.passwordTitle"></h2></div>
      <p id="backupPasswordMessage" data-i18n="backup.passwordMessage"></p>
      <div class="field"><label for="backupPassword" data-i18n="backup.password"></label><input id="backupPassword" type="password" minlength="12" maxlength="1024" autocomplete="new-password" /></div>
      <div class="field" id="backupPasswordConfirmField"><label for="backupPasswordConfirm" data-i18n="backup.confirmPassword"></label><input id="backupPasswordConfirm" type="password" minlength="12" maxlength="1024" autocomplete="new-password" /></div>
      <div id="backupPasswordError" class="live-submit-warning hidden" role="alert"></div>
      <div class="live-submit-modal-actions"><button id="cancelBackupPassword" class="secondary" type="button" data-i18n="action.cancel"></button><button id="confirmBackupPassword" class="success" type="button" data-i18n="action.continue"></button></div>
    </div>
  </div>

  <div id="setupWizard" class="modal-backdrop hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="setupWizardTitle">
      <div class="modal-head"><h2 id="setupWizardTitle" data-i18n="setup.title"></h2></div>
      <p id="setupIntro" data-i18n="setup.intro"></p>
      <div id="setupReadinessList" class="preflight-list" aria-live="polite"></div>
      <div id="setupSafetyNotice" class="live-submit-warning" data-i18n="setup.safety"></div>
      <label class="checkbox-row"><input id="setupSafetyAcknowledge" type="checkbox" /> <span id="setupSafetyAcknowledgeLabel" data-i18n="setup.safetyAcknowledge"></span></label>
      <div class="live-submit-modal-actions"><button id="setupLater" class="secondary" type="button" data-i18n="action.continueLater"></button><button id="setupOpenSettings" class="secondary" type="button" data-i18n="action.settings"></button><button id="setupFinish" class="success" type="button" data-i18n="action.finishSetup"></button></div>
    </div>
  </div>

  <div id="supportBundleModal" class="modal-backdrop hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="supportBundleTitle">
      <div class="modal-head"><h2 id="supportBundleTitle" data-i18n="support.title"></h2></div>
      <p><span id="supportReferenceLabel" data-i18n="support.reference"></span>: <strong id="supportReferenceId"></strong></p>
      <p id="supportBundleMetadata"></p>
      <div class="preflight-list">
        <label><input type="checkbox" data-support-component="system" /> <span id="supportSystemLabel" data-i18n="support.component.system"></span></label>
        <label><input type="checkbox" data-support-component="settings" /> <span id="supportSettingsLabel" data-i18n="support.component.settings"></span></label>
        <label><input type="checkbox" data-support-component="history" /> <span id="supportHistoryLabel" data-i18n="support.component.history"></span></label>
        <label><input type="checkbox" data-support-component="logs" /> <span id="supportLogsLabel" data-i18n="support.component.logs"></span></label>
        <label><input type="checkbox" data-support-component="step3Diagnostics" /> <span id="supportStep3Label" data-i18n="support.component.step3"></span></label>
      </div>
      <div id="supportBundleExclusions" class="live-submit-warning"></div>
      <label><input id="supportBundleAcknowledge" type="checkbox" /> <span id="supportAcknowledgeLabel" data-i18n="support.acknowledge"></span></label>
      <div class="live-submit-modal-actions"><button id="cancelSupportBundle" class="secondary" type="button" data-i18n="action.cancel"></button><button id="confirmSupportBundle" class="success" type="button" disabled data-i18n="support.create"></button></div>
    </div>
  </div>

  <script src="renderer/shared-context.js"></script>
  <script src="renderer/onboarding.js"></script>
  <script src="renderer/step2-copy.js"></script>
  <script src="renderer/step3-queue.js"></script>
  <script src="renderer/privacy-data-management.js"></script>
  <script src="renderer/update-progress.js"></script>
  <script src="renderer.js"></script>
</body>
