<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="app.title"></title>
  <link rel="stylesheet" href="renderer/base.css" />
  <link rel="stylesheet" href="renderer/components.css" />
  <link rel="stylesheet" href="renderer/setup-assistant.css" />
</head>
<body>
  <header>
    <div id="isolatedTestBanner" class="isolated-test-banner" role="status" aria-live="polite" hidden>
      <span data-i18n="app.isolatedBanner"></span>
      <span id="isolatedTestPath" class="isolated-test-path"></span>
    </div>
    <div class="topbar">
      <div>
        <h1 id="appTitle" data-i18n="app.title"></h1>
        <div id="appSubtitle" class="subtitle" data-i18n="app.subtitle"></div>
      </div>
      <div class="theme-control">
        <label for="localeSelect" data-i18n="settings.language"></label>
        <select id="localeSelect"><option value="en-CA">English (Canada)</option><option value="fr-CA">Français (Canada)</option></select>
        <label for="themeSelect" data-i18n="settings.theme"></label>
        <select id="themeSelect">
          <option value="system" data-i18n="theme.system"></option>
          <option value="dark" data-i18n="theme.dark"></option>
          <option value="light" data-i18n="theme.light"></option>
          <option value="high-contrast" data-i18n="theme.highContrast"></option>
        </select>
      </div>
    </div>
  </header>

  <main class="tabbed-main">
    <section class="card app-shell">
      <div class="step-tabs" role="tablist" data-i18n-aria-label="nav.sectionsAria">
        <button id="tabSettings" class="step-tab active" data-tab="settingsTab" type="button" role="tab" aria-controls="settingsTab" aria-selected="true" tabindex="0"><span class="step-tab-title" data-i18n="nav.settings.title"></span><span class="step-tab-detail" data-i18n="nav.settings.detail"></span></button>
        <button id="tabStep1" class="step-tab" data-tab="step1" type="button" role="tab" aria-controls="step1" aria-selected="false" tabindex="-1"><span class="step-tab-title" data-i18n="nav.step1.title"></span><span class="step-tab-detail" data-i18n="nav.step1.detail"></span></button>
        <button id="tabStep2" class="step-tab" data-tab="step2" type="button" role="tab" aria-controls="step2" aria-selected="false" tabindex="-1"><span class="step-tab-title" data-i18n="nav.step2.title"></span><span class="step-tab-detail" data-i18n="nav.step2.detail"></span></button>
        <button id="tabStep3" class="step-tab" data-tab="step3" type="button" role="tab" aria-controls="step3" aria-selected="false" tabindex="-1"><span class="step-tab-title" data-i18n="nav.step3.title"></span><span class="step-tab-detail" data-i18n="nav.step3.detail"></span></button>
        <button id="tabHistory" class="step-tab" data-tab="historyTab" type="button" role="tab" aria-controls="historyTab" aria-selected="false" tabindex="-1"><span class="step-tab-title" data-i18n="nav.history.title"></span><span class="step-tab-detail" data-i18n="nav.history.detail"></span></button>
        <button id="tabResults" class="step-tab" data-tab="resultsTab" type="button" role="tab" aria-controls="resultsTab" aria-selected="false" tabindex="-1"><span class="step-tab-title" data-i18n="nav.results.title"></span><span class="step-tab-detail" data-i18n="nav.results.detail"></span><span id="notificationsBadge" class="notification-badge hidden" data-i18n-aria-label="results.notificationsAria" aria-hidden="true" hidden></span></button>
      </div>

      <section id="settingsTab" class="tab-panel settings-panel active" role="tabpanel" aria-labelledby="tabSettings">
        <div class="step-title-row">
          <h2 data-i18n="settings.title"></h2>
          <div><button id="resumeSetup" class="secondary hidden" type="button" data-i18n="action.resumeSetup"></button> <span id="settingsStatus" class="pill" data-i18n="settings.notSaved"></span></div>
        </div>

        <div class="guided-setup-launch">
          <div>
            <strong data-i18n="setupAssistant.launch.title"></strong>
            <p data-i18n="setupAssistant.launch.description"></p>
          </div>
          <button id="guidedCanadaPostSetup" class="success" type="button" data-i18n="setupAssistant.launch.button"></button>
        </div>

        <div class="settings-grid">
          <div class="settings-section">
            <h3 data-i18n="settings.website.title"></h3>
            <div class="field">
              <label for="webUsername" data-i18n="settings.website.username"></label>
              <input id="webUsername" type="text" data-i18n-placeholder="settings.website.usernamePlaceholder" autocomplete="username" />
            </div>
            <div class="field">
              <label for="webPassword" data-i18n="settings.website.password"></label>
              <input id="webPassword" type="password" data-i18n-placeholder="settings.website.passwordPlaceholder" autocomplete="current-password" />
            </div>
            <div class="check-row">
              <label><input id="rememberSettings" type="checkbox" checked /> <span data-i18n="settings.website.remember"></span></label>
            </div>
            <div class="settings-note" data-i18n="settings.website.securityNote"></div>
          </div>

          <div class="settings-section">
            <h3 data-i18n="settings.api.title"></h3>
            <div class="field">
              <label for="trackingClientId" data-i18n="settings.api.clientId"></label>
              <input id="trackingClientId" type="text" data-i18n-placeholder="settings.api.clientIdPlaceholder" autocomplete="off" />
            </div>
            <div class="field">
              <label for="trackingClientSecret" data-i18n="settings.api.clientSecret"></label>
              <input id="trackingClientSecret" type="password" data-i18n-placeholder="settings.api.clientSecretPlaceholder" autocomplete="new-password" />
            </div>
            <details class="settings-note">
              <summary data-i18n="settings.api.advanced"></summary>
              <div class="field">
                <label for="trackingRequestDelayMs" data-i18n="settings.api.requestInterval"></label>
                <input id="trackingRequestDelayMs" type="number" min="3100" max="60000" step="100" value="3100" inputmode="numeric" />
              </div>
              <div class="field">
                <label for="trackingResourceTimeoutMs" data-i18n="settings.api.timeout"></label>
                <input id="trackingResourceTimeoutMs" type="number" min="1000" max="120000" step="1000" value="45000" inputmode="numeric" />
              </div>
              <div data-i18n="settings.api.defaultsNote"></div>
            </details>
            <div id="trackingApiCredentialMetadata" class="settings-note" data-i18n="settings.api.metadataPending"></div>
            <div class="settings-note" data-i18n="settings.api.accessNote"></div>
            <button id="clearTrackingApiCredentials" class="warning" type="button" data-i18n="settings.api.clear"></button>
          </div>

          <div class="settings-section">
            <h3 data-i18n="settings.est.title"></h3>
            <div class="field">
              <label for="estCustomerNumber" data-i18n="settings.est.customerNumber"></label>
              <input id="estCustomerNumber" type="text" data-i18n-placeholder="placeholder.customerNumber" data-i18n-aria-label="settings.est.customerNumber" autocomplete="off" />
            </div>
          </div>

          <div class="settings-section wide">
            <h3 data-i18n="settings.sender.title"></h3>
            <div class="settings-two-col">
              <div class="field">
                <label for="claimStreetNumber" data-i18n="settings.sender.streetNumber"></label>
                <input id="claimStreetNumber" type="text" data-i18n-placeholder="placeholder.streetNumber" />
              </div>
              <div class="field">
                <label for="claimStreetName" data-i18n="settings.sender.streetName"></label>
                <input id="claimStreetName" type="text" data-i18n-placeholder="placeholder.streetName" />
              </div>
            </div>
            <div class="settings-three-col">
              <div class="field">
                <label for="claimPostalCode" data-i18n="settings.sender.postalCode"></label>
                <input id="claimPostalCode" type="text" data-i18n-placeholder="placeholder.postalCode" />
              </div>
              <div class="field">
                <label for="claimCity" data-i18n="settings.sender.city"></label>
                <input id="claimCity" type="text" data-i18n-placeholder="placeholder.city" />
              </div>
              <div class="field">
                <label for="claimProvince" data-i18n="settings.sender.province"></label>
                <input id="claimProvince" type="text" data-i18n-placeholder="placeholder.province" />
              </div>
            </div>
            <div class="field">
              <label for="claimAddressLine2" data-i18n="settings.sender.addressLine2"></label>
              <input id="claimAddressLine2" type="text" data-i18n-placeholder="placeholder.addressLine2" />
            </div>
          </div>

          <div class="settings-section wide">
            <h3 data-i18n="settings.contact.title"></h3>
            <div class="settings-three-col">
              <div class="field">
                <label for="claimBusinessName" data-i18n="settings.contact.businessName"></label>
                <input id="claimBusinessName" type="text" data-i18n-placeholder="placeholder.businessName" />
              </div>
              <div class="field">
                <label for="claimContactName" data-i18n="settings.contact.name"></label>
                <input id="claimContactName" type="text" data-i18n-placeholder="placeholder.contactName" />
              </div>
              <div class="field">
                <label for="claimContactPhone" data-i18n="settings.contact.phone"></label>
                <input id="claimContactPhone" type="text" data-i18n-placeholder="placeholder.phone" />
              </div>
            </div>
            <div class="field">
              <label for="claimContactEmail" data-i18n="settings.contact.email"></label>
              <input id="claimContactEmail" type="email" data-i18n-placeholder="placeholder.email" />
            </div>
          </div>
          <div class="settings-section wide">
            <button id="saveUserSettings" class="success" type="button" data-i18n="settings.save"></button>
            <div class="settings-footer-actions">
              <button id="checkForUpdates" class="secondary" type="button" data-i18n="update.check"></button>
              <div class="app-version"><span data-i18n="app.version"></span> <strong id="appVersion"></strong></div>
            </div>
          </div>
        </div>
      </section>

      <section id="step1" class="tab-panel step-panel" role="tabpanel" aria-labelledby="tabStep1">
        <div class="step-top">
          <div class="step-title-row">
            <h2 data-i18n="step1.title"></h2>
            <span class="pill" data-i18n="step1.createsTrackingCsv"></span>
          </div>
          <p class="step-description" data-i18n="step1.rollingWindow"></p>
          <p class="muted" data-i18n="step1.carryForward"></p>
          <input id="estWorkgroup" type="hidden" value="" />
          <input id="estMobo" type="hidden" value="-2" />
          <input id="estCategoryGroup" type="hidden" value="SHP" />
          <input id="estFileTypes" type="hidden" value="1,2" />
          <input id="historyCustomerNumber" type="hidden" />
          <input id="historyMobo" type="hidden" />
          <input id="historyAutoMobo" type="checkbox" checked hidden />
          <input id="historyIncludeNoManifest" type="checkbox" checked hidden />
          <div class="step-actions step-execution-controls">
            <button id="importEstHistory" class="success step-execution-control" data-i18n="step1.run"></button>
            <button id="forceStopStep1" class="danger step-execution-control" data-force-stop="step1" data-i18n="action.forceStop"></button>
          </div>
        </div>
        <div class="step-workspace">
          <div class="card step-status-card">
            <div class="row" style="justify-content: space-between;">
              <h2 style="margin:0;" data-i18n="step1.statusTitle"></h2>
              <span id="step1RunStatus" class="pill" data-i18n="runStatus.idle"></span>
            </div>
            <div class="status-grid">
              <div class="stat"><div id="step1Orders" class="num">0</div><div class="label" data-i18n="step1.ordersFound"></div></div>
              <div class="stat"><div id="step1Imported" class="num">0</div><div class="label" data-i18n="step1.shipmentsImported"></div></div>
              <div class="stat"><div id="step1Workgroups" class="num">0</div><div class="label" data-i18n="step1.workgroups"></div></div>
              <div id="step1WarningsCard" class="stat stat-clickable" role="button" tabindex="0" data-i18n-aria-label="step1.warningsAria"><div id="step1Warnings" class="num">0</div><div class="label" data-i18n="step1.warningsInspect"></div></div>
            </div>
            <div class="progress-wrap">
              <div class="progress-label"><span data-i18n="step1.progress"></span><span id="step1Pct">0%</span></div>
              <progress id="step1Progress" max="100" value="0"></progress>
            </div>
            <div class="current-action" id="step1CurrentAction" data-i18n="status.waiting"></div>
          </div>
          <div class="card step-log-card">
            <div class="live-log-header"><h2 data-i18n="step1.liveLog"></h2><button id="step1JumpLatest" class="secondary jump-latest" type="button" hidden data-i18n="log.jumpLatest"></button></div>
            <div id="step1Log" class="log" role="log" aria-live="polite" aria-relevant="additions"></div>
          </div>
        </div>
      </section>

      <section id="step2" class="tab-panel step-panel" role="tabpanel" aria-labelledby="tabStep2">
        <div class="step-top">
          <div class="step-title-row">
            <h2 data-i18n="step2.title"></h2>
            <span class="pill" data-i18n="step2.readsTrackingCsv"></span>
          </div>
          <div class="step-fields step2-fields">
            <div id="step2CandidateExplanation" class="step-copy-box" data-i18n="step2.candidateExplanation"></div>
          </div>
          <div class="step-actions step-execution-controls">
            <button id="runTrackingOnly" class="success step-execution-control" data-i18n="step2.run"></button>
            <button id="forceStopStep2" class="danger step-execution-control" data-force-stop="step2" data-i18n="action.forceStop"></button>
          </div>
        </div>
        <div class="step-workspace">
          <div class="card step-status-card">
            <div class="row" style="justify-content: space-between;">
              <h2 style="margin:0;" data-i18n="step2.statusTitle"></h2>
              <span id="step2RunStatus" class="pill" data-i18n="runStatus.idle"></span>
            </div>
            <div class="status-grid">
              <div class="stat"><div id="checked" class="num">0</div><div class="label" data-i18n="step2.checked"></div></div>
              <div class="stat"><div id="late" class="num">0</div><div class="label" data-i18n="step2.lateClaims"></div></div>
              <div class="stat"><div id="onTime" class="num">0</div><div class="label" data-i18n="step2.onTime"></div></div>
              <div class="stat"><div id="notDelivered" class="num">0</div><div class="label" data-i18n="step2.notDelivered"></div></div>
            </div>
            <div class="progress-wrap">
              <div class="progress-label"><span data-i18n="step2.progress"></span><span id="trackingPct">0%</span></div>
              <progress id="trackingProgress" max="100" value="0"></progress>
            </div>
            <div class="current-action" id="step2CurrentAction" data-i18n="status.waiting"></div>
          </div>
          <div class="card step-log-card">
            <div class="live-log-header"><h2 data-i18n="step2.liveLog"></h2><button id="step2JumpLatest" class="secondary jump-latest" type="button" hidden data-i18n="log.jumpLatest"></button></div>
            <div id="step2Log" class="log" role="log" aria-live="polite" aria-relevant="additions"></div>
          </div>
        </div>
      </section>

      <section id="step3" class="tab-panel step-panel" role="tabpanel" aria-labelledby="tabStep3">
        <div class="step-top">
          <div class="step-title-row">
            <h2 data-i18n="step3.title"></h2>
            <span class="pill" data-i18n="step3.readsCandidates"></span>
          </div>
          <div id="step3CanadaPostSupport" role="note" data-i18n="step3.supportGuidance" data-i18n-aria-label="step3.supportAriaLabel"></div>
          <section id="step3ActionAdvisory" class="step3-action-advisory hidden" aria-labelledby="step3ActionAdvisoryTitle" aria-live="assertive">
            <h3 id="step3ActionAdvisoryTitle" data-i18n="step3.actionIssues.title"></h3>
            <div id="step3ActionIssues" class="blocking-check-list"></div>
            <div id="step3ActionWarningCount" class="modal-summary"></div>
          </section>
          <input id="freshRun" type="checkbox" hidden />
          <div class="step-actions step-actions-3 step-execution-controls">
            <button id="runSubmitOnly" class="success step-execution-control" data-i18n="step3.submitSelected"></button>
            <button id="stop" class="warning step-execution-control" data-i18n="step3.stopAfterCurrent"></button>
            <button id="forceStopStep3" class="danger step-execution-control" data-force-stop="step3" data-i18n="action.forceStop"></button>
          </div>
        </div>
        <div class="step3-body">
        <div class="step3-side-pane">
        <div class="step3-control-grid">
          <section class="step3-control-card" aria-labelledby="claimQueueTitle">
            <div class="step3-control-head">
              <div>
                <h3 id="claimQueueTitle" data-i18n="step3.candidateQueue"></h3>
                <span id="claimQueueCount" class="pill" data-i18n="step3.queue.initialCount"></span>
              </div>
              <div class="step3-control-actions">
                <button id="refreshClaimQueue" class="secondary" type="button" data-i18n="action.refresh"></button>
                <button id="selectAllClaims" class="secondary" type="button" data-i18n="step3.selectAll"></button>
                <button id="clearClaimSelection" class="secondary" type="button" data-i18n="step3.clearSelection"></button>
              </div>
            </div>
            <div id="claimQueueList" class="claim-queue-list" aria-live="polite">
              <div class="history-empty" data-i18n="step3.queue.refreshEmpty"></div>
            </div>
          </section>
        </div>
          <div class="card step3-progress-card">
            <div class="progress-wrap">
              <div class="progress-label"><span data-i18n="step3.progress"></span><span><span id="submitProcessedMini">0/0</span> · <span id="submitPct">0%</span></span></div>
              <progress id="submitProgress" max="100" value="0"></progress>
            </div>
          </div>
        </div>
        <div class="step-workspace step3-workspace">
          <div class="card step-browser-card">
            <div class="row step-browser-header" style="justify-content: space-between;">
              <h2 style="margin:0;" data-i18n="step3.browserTitle"></h2>
              <span id="builtinBrowserStatus" class="pill" data-i18n="step3.browser.idleStatus"></span>
            </div>
            <section id="step3AutomationNotice" class="step3-automation-notice" role="note" aria-labelledby="step3AutomationNoticeTitle">
              <div class="step3-automation-notice-icon" aria-hidden="true"></div>
              <div>
                <h3 id="step3AutomationNoticeTitle" data-i18n="step3.automation.title"></h3>
                <p data-i18n="step3.automation.description"></p>
                <p data-i18n="step3.automation.exceptions"></p>
                <strong id="step3AutomationNoticeStatus" data-i18n="step3.automation.idle"></strong>
              </div>
            </section>
            <div id="builtinBrowserActivity" class="browser-activity" aria-live="polite" aria-atomic="true">
              <div class="browser-activity-copy">
                <span class="browser-activity-dot" aria-hidden="true"></span>
                <span id="builtinBrowserActivityText" data-i18n="step3.browser.idleStatus"></span>
              </div>
              <div class="browser-activity-track" aria-hidden="true"><span></span></div>
            </div>
            <div id="builtinBrowserSlot" class="browser-slot">
              <div class="browser-slot-placeholder" data-i18n="step3.browser.idle"></div>
            </div>
          </div>
        </div>
        <div class="card step-log-card step3-log-card">
          <div class="row step3-log-header" style="justify-content: space-between; align-items: center;">
            <h2 style="margin:0;" data-i18n="step3.liveLog"></h2>
            <div class="live-log-actions"><button id="step3JumpLatest" class="secondary jump-latest" type="button" hidden data-i18n="log.jumpLatest"></button><button id="openStep3Diagnostics" class="secondary compact-button" type="button" data-i18n="diagnostics.openDetailed"></button></div>
          </div>
          <div id="step3Log" class="log" role="log" aria-live="polite" aria-relevant="additions"></div>
        </div>
        </div>
      </section>

      <section id="historyTab" class="tab-panel history-panel" role="tabpanel" aria-labelledby="tabHistory">
        <div class="step-title-row">
          <h2 data-i18n="history.title"></h2>
          <div class="history-actions">
            <button id="refreshHistory" class="secondary" type="button" data-i18n="action.refresh"></button>
            <button id="exportHistory" class="secondary" type="button" data-i18n="history.exportCsv"></button>
          </div>
        </div>

        <div class="history-summary">
          <div class="stat"><div id="historySubmitted" class="num">0</div><div class="label" data-i18n="history.submitted"></div></div>
          <div class="stat"><div id="historyNeedsAttention" class="num">0</div><div class="label" data-i18n="history.needsAttention"></div></div>
          <div class="stat"><div id="historyRecordTotal" class="num">0</div><div class="label" data-i18n="history.totalRecords"></div></div>
        </div>

        <div class="history-content">
          <div class="history-section">
            <div class="history-section-head"><h3 data-i18n="history.claimAttempts"></h3><span id="historyResultCount" class="pill" role="status" aria-live="polite" data-i18n="history.zeroRecords"></span></div>
            <div id="historyList" class="history-list history-record-list"></div>
          </div>
        </div>
      </section>

      <section id="resultsTab" class="tab-panel results-panel" role="tabpanel" aria-labelledby="tabResults">
        <div class="step-title-row">
          <h2 data-i18n="results.title"></h2>
          <span id="notificationsCountPill" class="pill hidden" aria-hidden="true" hidden></span>
        </div>

        <div id="opsListScreen" class="operations-grid">
          <div class="operations-panel">
            <div class="mini-title" data-i18n="results.clickDetails"></div>
            <div class="ops-table" id="resultsList"></div>
          </div>
        </div>

        <div id="detailScreen" class="detail-screen hidden">
          <div class="detail-toolbar">
            <button id="backToOperations" class="secondary" data-i18n="results.back"></button>
            <span id="detailBadge" class="pill" data-i18n="results.detailBadge"></span>
          </div>

          <div class="detail-grid">
            <div class="detail-card">
              <h3 id="detailTitle" class="detail-title" data-i18n="results.detailTitle"></h3>

              <div class="detail-meta-grid">
                <div class="detail-meta"><div class="detail-label" data-i18n="common.status"></div><div id="detailStatus" class="detail-value">—</div></div>
                <div class="detail-meta"><div class="detail-label" data-i18n="common.time"></div><div id="detailTime" class="detail-value">—</div></div>
                <div class="detail-meta"><div class="detail-label" data-i18n="common.csvRow"></div><div id="detailRow" class="detail-value">—</div></div>
                <div class="detail-meta"><div class="detail-label" data-i18n="common.source"></div><div id="detailSource" class="detail-value">—</div></div>
                <div class="detail-meta wide"><div class="detail-label" data-i18n="common.trackingNumber"></div><div id="detailTracking" class="detail-value">—</div></div>
              </div>

              <div class="detail-section-title" data-i18n="results.explanation"></div>
              <div id="detailExplanation" class="detail-copy">—</div>

              <div class="detail-section-title" data-i18n="results.automationDecision"></div>
              <div id="detailDecision" class="detail-copy">—</div>
            </div>

            <div class="detail-card evidence-card">
              <div class="mini-title" data-i18n="results.canadaPostEvidence"></div>
              <div id="detailEvidenceStatus" class="detail-copy" data-i18n="results.loadingEvidence"></div>
              <div class="detail-evidence-actions">
                <button id="openScreenshot" class="secondary" data-i18n="results.openScreenshot"></button>
              </div>
              <div id="detailScreenshotWrap" class="detail-screenshot-wrap hidden">
                <img id="detailScreenshot" class="detail-screenshot" data-i18n-alt="results.screenshotAlt" />
              </div>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div id="warningModal" class="modal-backdrop hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="warningModalTitle">
      <div class="modal-head">
        <h2 id="warningModalTitle" data-i18n="step1.warningsTitle"></h2>
        <button id="closeWarningModal" class="secondary" type="button" data-i18n="action.close"></button>
      </div>
      <div id="warningModalSummary" class="modal-summary" data-i18n="step1.noWarnings"></div>
      <div id="warningList" class="warning-list"></div>
    </div>
  </div>

  <div id="setupAssistant" class="setup-assistant hidden" aria-hidden="true" hidden>
    <div class="setup-assistant-shell" role="dialog" aria-modal="true" aria-labelledby="setupAssistantTitle">
      <div class="setup-assistant-header">
        <div>
          <h2 id="setupAssistantTitle" data-i18n="setupAssistant.title"></h2>
          <p data-i18n="setupAssistant.subtitle"></p>
        </div>
        <div class="setup-assistant-header-actions">
          <div class="setup-assistant-back-wrap">
            <button id="setupAssistantBrowserBack" class="secondary" type="button" disabled data-i18n="setupAssistant.browserBack"></button>
            <span id="setupAssistantBackCallout" class="setup-assistant-header-callout hidden" data-i18n="setupAssistant.callout.goBack"></span>
          </div>
          <button id="setupAssistantStartOver" class="secondary" type="button" data-i18n="setupAssistant.startOver"></button>
          <div class="sound-switch-setting compact">
            <span data-i18n="settings.guidanceSounds"></span>
            <button id="setupAssistantGuidanceSounds" class="toggle-switch" type="button" role="switch" aria-checked="true" data-i18n-aria-label="settings.guidanceSounds">
              <span class="toggle-switch-track" aria-hidden="true"><span class="toggle-switch-thumb"></span></span>
              <span id="setupAssistantGuidanceSoundsState" class="toggle-switch-state" data-i18n="settings.guidanceSoundsOn"></span>
            </button>
          </div>
          <button id="setupAssistantClose" class="secondary" type="button" data-i18n="setupAssistant.close"></button>
        </div>
      </div>
      <div class="setup-assistant-layout">
        <nav id="setupAssistantStepsPanel" class="setup-assistant-progress" data-i18n-aria-label="setupAssistant.progressAria" data-native-view-exclusion="true">
          <ol id="setupAssistantSteps"></ol>
        </nav>
        <div class="setup-assistant-browser-area">
          <div id="setupAssistantBrowserSlot" class="setup-assistant-browser-slot" tabindex="-1" data-native-view-slot="true">
            <div id="setupAssistantBrowserPlaceholder" class="setup-assistant-browser-placeholder" data-i18n="setupAssistant.browserPreparing"></div>
          </div>
          <div id="setupAssistantCompletionSurface" class="setup-assistant-completion-surface hidden" aria-live="polite">
            <strong data-i18n="setupAssistant.completionSurface.title"></strong>
            <p data-i18n="setupAssistant.completionSurface.body"></p>
          </div>
          <div id="setupAssistantPageStatus" class="setup-assistant-page-status" role="status" aria-live="polite"></div>
        </div>
        <aside id="setupAssistantGuidance" class="setup-assistant-guidance" data-native-view-exclusion="true">
          <p id="setupAssistantStepNumber" class="eyebrow"></p>
          <h3 id="setupAssistantStepTitle"></h3>
          <h4 class="setup-assistant-now" data-i18n="setupAssistant.whatToDoNow"></h4>
          <p id="setupAssistantStepGuidance"></p>
          <div class="setup-assistant-auto"><strong data-i18n="setupAssistant.whatHappensNext"></strong><span data-i18n="setupAssistant.autoContinue"></span></div>
          <div id="setupAssistantDetectedState" class="settings-note hidden" role="status" aria-live="polite"></div>
          <div id="setupAssistantFeedback" class="setup-assistant-feedback hidden" role="status" aria-live="polite"></div>
          <div id="setupAssistantLocalLoading" class="setup-assistant-local-loading hidden" role="status"><span aria-hidden="true"></span><strong data-i18n="setupAssistant.settling.wait"></strong></div>
          <div id="setupAssistantVerificationNotice" class="settings-note" data-i18n="setupAssistant.verificationNotice"></div>

          <div id="setupAssistantAccountFields" class="setup-assistant-fields">
            <div class="field"><label for="setupAssistantWebUsername" data-i18n="settings.website.username"></label><input id="setupAssistantWebUsername" type="text" autocomplete="username" data-i18n-placeholder="settings.website.usernamePlaceholder" /></div>
            <div class="field"><label for="setupAssistantWebPassword" data-i18n="settings.website.password"></label><input id="setupAssistantWebPassword" type="password" autocomplete="current-password" data-i18n-placeholder="settings.website.passwordPlaceholder" /></div>
            <div class="settings-note" data-i18n="setupAssistant.passwordPrivacy"></div>
          </div>

          <div id="setupAssistantCustomerCandidates" class="setup-assistant-candidates hidden" aria-live="polite">
            <strong id="setupAssistantCustomerCandidateIntro"></strong>
            <div id="setupAssistantCustomerCandidateList"></div>
            <button id="setupAssistantCustomerReject" class="secondary" type="button" data-i18n="setupAssistant.customerNumber.reject"></button>
          </div>
          <div id="setupAssistantBusinessConfirmed" class="setup-assistant-business-confirmed hidden" aria-live="polite">
            <strong data-i18n="setupAssistant.businessConfirmed.title"></strong>
            <span id="setupAssistantConfirmedBusinessName"></span>
            <span id="setupAssistantConfirmedCustomerNumber"></span>
          </div>
          <div id="setupAssistantCustomerFields" class="setup-assistant-fields hidden">
            <details id="setupAssistantManualCustomer">
              <summary data-i18n="setupAssistant.customerNumber.manualInstead"></summary>
              <div class="field"><label for="setupAssistantCustomerNumber" data-i18n="setupAssistant.customerNumber.label"></label><input id="setupAssistantCustomerNumber" type="text" inputmode="numeric" maxlength="10" pattern="[0-9]{1,10}" autocomplete="off" data-i18n-placeholder="placeholder.customerNumber" /></div>
              <div id="setupAssistantCustomerValidation" class="field-help" role="status"></div>
            </details>
          </div>

          <div id="setupAssistantApiFields" class="setup-assistant-fields hidden">
            <div id="setupAssistantCredentialStatus" class="setup-assistant-feedback hidden" role="status" aria-live="polite"></div>
            <div id="setupAssistantApiKeyField">
              <div class="setup-assistant-term-map"><strong data-i18n="setupAssistant.apiKey.term"></strong><span data-i18n="setupAssistant.apiKey.mapping"></span></div>
              <div id="setupAssistantApiKeyCallout" class="setup-assistant-local-callout hidden" data-i18n="setupAssistant.callout.pasteApiKey"></div>
              <div class="field"><label for="setupAssistantClientId" data-i18n="setupAssistant.apiKey.label"></label><input id="setupAssistantClientId" type="text" autocomplete="off" data-i18n-placeholder="settings.api.clientIdPlaceholder" /></div>
            </div>
            <div id="setupAssistantApiSecretField" class="hidden">
              <div class="setup-assistant-term-map"><strong data-i18n="setupAssistant.apiSecret.term"></strong><span data-i18n="setupAssistant.apiSecret.mapping"></span></div>
              <div id="setupAssistantApiSecretCallout" class="setup-assistant-local-callout hidden" data-i18n="setupAssistant.callout.pasteApiSecret"></div>
              <div class="field"><label for="setupAssistantClientSecret" data-i18n="setupAssistant.apiSecret.label"></label><input id="setupAssistantClientSecret" type="password" autocomplete="new-password" data-i18n-placeholder="settings.api.clientSecretPlaceholder" /></div>
            </div>
            <select id="setupAssistantApiEnvironment" class="hidden" aria-hidden="true" tabindex="-1"><option value="production" data-i18n="environment.production"></option></select>
            <div class="settings-note" data-i18n="setupAssistant.apiSecretPrivacy"></div>
          </div>

          <div id="setupAssistantFinish" class="setup-assistant-finish hidden">
            <div id="setupAssistantChecklist" class="setup-assistant-checklist" aria-live="polite"></div>
            <p data-i18n="setupAssistant.finishPrivacy"></p>
          </div>

          <div id="setupAssistantFallback" class="setup-assistant-fallback hidden" role="note"></div>
          <div id="setupAssistantError" class="modal-warning hidden" role="alert"></div>
          <div id="setupAssistantStartOverConfirm" class="setup-assistant-confirm hidden" role="alertdialog" aria-modal="false" aria-labelledby="setupAssistantStartOverTitle">
            <strong id="setupAssistantStartOverTitle" data-i18n="setupAssistant.startOverConfirm.title"></strong>
            <p data-i18n="setupAssistant.startOverConfirm.body"></p>
            <p data-i18n="setupAssistant.startOverConfirm.remoteNotice"></p>
            <div><button id="setupAssistantStartOverConfirmButton" class="danger" type="button" data-i18n="setupAssistant.startOver"></button><button id="setupAssistantStartOverCancel" class="secondary" type="button" data-i18n="action.cancel"></button></div>
          </div>
          <div class="setup-assistant-actions">
            <button id="setupAssistantBack" class="secondary" type="button" data-i18n="action.back"></button>
            <button id="setupAssistantCantFind" class="secondary" type="button" data-i18n="setupAssistant.cantFind"></button>
            <button id="setupAssistantRetry" class="secondary hidden" type="button" data-i18n="setupAssistant.retry"></button>
            <button id="setupAssistantNext" class="success" type="button" data-i18n="action.continue"></button>
            <button id="setupAssistantSaveFinish" class="success hidden" type="button" data-i18n="setupAssistant.saveFinish"></button>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <div id="setupWizard" class="modal-backdrop hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="setupWizardTitle">
      <div class="modal-head"><h2 id="setupWizardTitle" data-i18n="setup.title"></h2></div>
      <p id="setupIntro" data-i18n="setup.intro"></p>
      <div id="setupReadinessList" class="preflight-list" aria-live="polite"></div>
      <div id="setupSafetyNotice" class="modal-warning" data-i18n="setup.safety"></div>
      <label class="checkbox-row"><input id="setupSafetyAcknowledge" type="checkbox" /> <span id="setupSafetyAcknowledgeLabel" data-i18n="setup.safetyAcknowledge"></span></label>
      <div class="modal-actions"><button id="setupLater" class="secondary" type="button" data-i18n="action.continueLater"></button><button id="setupOpenSettings" class="secondary" type="button" data-i18n="action.settings"></button><button id="setupFinish" class="success" type="button" data-i18n="action.finishSetup"></button></div>
    </div>
  </div>

  <script src="renderer/shared-context.js"></script>
  <script src="renderer/onboarding.js"></script>
  <script src="renderer/step2-copy.js"></script>
  <script src="renderer/step3-queue.js"></script>
  <script src="renderer/update-progress.js"></script>
  <script src="renderer/setup-assistant.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
